<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北興國中捷報</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .poster {
    width: 540px;
    background: linear-gradient(160deg, #0a1a6e 0%, #0d2b9e 40%, #0a1a6e 100%);
    padding: 24px 20px 20px;
    position: relative;
    overflow: hidden;
    border: 3px solid #f0c030;
  }

  /* 星星裝飾 */
  .stars {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0; left: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .star {
    position: absolute;
    color: #ffe066;
    font-size: 18px;
    opacity: 0.7;
    animation: twinkle 2s infinite alternate;
  }
  .star:nth-child(1)  { top: 4%;  left: 3%;  font-size: 22px; }
  .star:nth-child(2)  { top: 2%;  left: 88%; font-size: 26px; }
  .star:nth-child(3)  { top: 10%; left: 94%; font-size: 16px; }
  .star:nth-child(4)  { top: 18%; left: 1%;  font-size: 14px; }
  .star:nth-child(5)  { top: 30%; left: 96%; font-size: 18px; }
  .star:nth-child(6)  { top: 50%; left: 2%;  font-size: 14px; }
  .star:nth-child(7)  { top: 70%; left: 95%; font-size: 16px; }
  .star:nth-child(8)  { top: 85%; left: 4%;  font-size: 20px; }
  .star:nth-child(9)  { top: 92%; left: 90%; font-size: 14px; }
  .star:nth-child(10) { top: 60%; left: 97%; font-size: 12px; }
  @keyframes twinkle { from { opacity: 0.4; } to { opacity: 1; } }

  /* 標題 */
  .title {
    text-align: center;
    color: #fff;
    font-size: 32px;
    font-weight: 900;
    line-height: 1.3;
    text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
    letter-spacing: 6px;
    margin-bottom: 20px;
    position: relative;
    z-index: 1;
  }
  .title span {
    color: #ffe066;
  }

  /* 主數字區 */
  .badge-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin-bottom: 16px;
    position: relative;
    z-index: 1;
  }

  .badge {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .badge-circle {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffe566, #e8a000);
    border: 5px solid #fff;
    box-shadow: 0 0 20px rgba(255,200,0,0.6), inset 0 -4px 8px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .badge-circle .number {
    font-size: 48px;
    font-weight: 900;
    color: #8b1a00;
    line-height: 1;
    text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
  }

  .badge-circle .unit {
    font-size: 16px;
    font-weight: 700;
    color: #8b1a00;
  }

  /* 皇冠 */
  .crown {
    font-size: 28px;
    margin-bottom: -6px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
  }

  /* 星星排 */
  .badge-stars {
    color: #ffe066;
    font-size: 14px;
    margin-top: 4px;
    letter-spacing: 2px;
  }

  .badge-label {
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    margin-top: 8px;
    text-align: center;
  }

  .badge-sub {
    background: #e53030;
    color: #fff;
    border-radius: 20px;
    padding: 3px 14px;
    font-size: 15px;
    font-weight: 700;
    margin-top: 6px;
  }

  .badge-center-label {
    color: #ffe066;
    font-size: 18px;
    font-weight: 900;
    text-align: center;
    align-self: center;
    margin-top: 30px;
    text-shadow: 1px 1px 4px rgba(0,0,0,0.5);
  }

  /* 分隔線段落 */
  .section {
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 10px;
    position: relative;
    z-index: 1;
  }

  .section-blue {
    background: #1a3fbf;
    border: 2px solid #4a7aff;
  }

  .section-highlight {
    background: #fff;
    border: 2px solid #e8a000;
  }

  .section-gold {
    background: linear-gradient(90deg, #ffe566, #f0c030);
    border: 2px solid #c08000;
  }

  .section-row {
    display: flex;
    justify-content: space-around;
    gap: 10px;
  }

  .section-item {
    flex: 1;
    border-radius: 6px;
    padding: 8px 10px;
    text-align: center;
  }

  .item-blue {
    background: #1e4ed8;
    border: 2px solid #6090ff;
  }

  .item-red {
    background: #cc2020;
    border: 2px solid #ff6060;
  }

  .item-title {
    font-size: 16px;
    font-weight: 900;
    color: #ffe066;
    margin-bottom: 4px;
  }

  .item-body {
    font-size: 13px;
    color: #fff;
    line-height: 1.6;
  }

  .highlight-text {
    font-size: 17px;
    font-weight: 900;
    color: #cc1a00;
    text-align: center;
    line-height: 1.7;
  }

  .highlight-text .em {
    color: #0050cc;
    font-size: 20px;
  }

  /* 底部格言 */
  .footer {
    text-align: center;
    color: #ffe066;
    font-size: 14px;
    font-weight: 700;
    margin-top: 14px;
    letter-spacing: 1px;
    position: relative;
    z-index: 1;
    border-top: 1px solid rgba(255,220,50,0.4);
    padding-top: 10px;
  }

  /* MVP 標籤 */
  .mvp-tag {
    position: absolute;
    bottom: 10px;
    left: 10px;
    background: #e8a000;
    color: #000;
    font-size: 11px;
    font-weight: 900;
    padding: 2px 8px;
    border-radius: 4px;
    z-index: 2;
  }
</style>
</head>
<body>
<div class="poster">
  <!-- 星星 -->
  <div class="stars">
    <div class="star">★</div>
    <div class="star">✦</div>
    <div class="star">★</div>
    <div class="star">✦</div>
    <div class="star">★</div>
    <div class="star">✦</div>
    <div class="star">★</div>
    <div class="star">✦</div>
    <div class="star">★</div>
    <div class="star">✦</div>
  </div>

  <!-- 標題 -->
  <div class="title">
    北興之光<br>
    <span>嘉中科學班捷報</span> 🏆
  </div>

  <!-- 主數字徽章 -->
  <div class="badge-row">
    <div class="badge">
      <div class="crown">👑</div>
      <div class="badge-circle">
        <div class="number">14</div>
        <div class="unit">位</div>
      </div>
      <div class="badge-stars">★ ★ ★ ★ ★</div>
      <div class="badge-label">北興錄取人數</div>
      <div class="badge-sub">近三分之二</div>
    </div>

    <div class="badge-center-label">嘉義<br>第一</div>

    <div class="badge">
      <div class="crown">👑</div>
      <div class="badge-circle">
        <div class="number">2/3</div>
      </div>
      <div class="badge-stars">★ ★ ★ ★ ★</div>
      <div class="badge-label">占總錄取名額</div>
      <div class="badge-sub">全市最強</div>
    </div>
  </div>

  <!-- 亮點說明 -->
  <div class="section section-highlight">
    <div class="highlight-text">
      嘉中科學班共錄取 <span class="em">21 位</span><br>
      北興學子即占 <span class="em">14 位</span>，高達 <span class="em">⅔</span><br>
      連續奪下嘉義市公立學校第一！
    </div>
  </div>

  <!-- 科學班亮點 -->
  <div class="section-row" style="margin-bottom:10px; position:relative; z-index:1;">
    <div class="section-item item-blue">
      <div class="item-title">🔬 嘉中科學班</div>
      <div class="item-body">錄取 <strong style="font-size:22px;color:#ffe066;">14</strong> 人<br>占總額 <strong>⅔</strong></div>
    </div>
    <div class="section-item item-red">
      <div class="item-title">🏫 全市公立學校</div>
      <div class="item-body">北興排名<br><strong style="font-size:22px;color:#ffe066;">第 1 名</strong></div>
    </div>
  </div>

  <!-- 底部 -->
  <div class="section section-gold" style="position:relative;z-index:1;">
    <div style="text-align:center; font-size:15px; font-weight:900; color:#5a2d00;">
      追求卓越並成就每個孩子是北興一貫的教育理念
    </div>
  </div>

  <div class="footer">
    #北興之光 ｜ #嘉中科學班 ｜ #115學年度
  </div>

  <div class="mvp-tag">MVP</div>
</div>
</body>
</html>
