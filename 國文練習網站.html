<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>國中國文練習 — 陋室銘・鳥・深藍的憂鬱・秋之味</title>
<style>
  :root {
    --bg: #f0f4f8;
    --card: #ffffff;
    --primary: #2563eb;
    --green: #16a34a;
    --red: #dc2626;
    --gray: #64748b;
    --dark: #1e293b;
    --border: #e2e8f0;
    --yellow: #fbbf24;
    --light-green: #dcfce7;
    --light-red: #fee2e2;
    --light-blue: #dbeafe;
    --purple: #9333ea;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "微軟正黑體","Microsoft JhengHei",sans-serif; background: var(--bg); color: var(--dark); min-height: 100vh; }

  /* ===== LOGIN ===== */
  #login-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:24px; }
  #login-screen h1 { font-size:26px; font-weight:700; margin-bottom:6px; text-align:center; }
  #login-screen p.sub { color:var(--gray); margin-bottom:28px; text-align:center; font-size:14px; }
  #login-card { background:var(--card); border-radius:16px; padding:32px 28px; box-shadow:0 4px 24px rgba(0,0,0,0.08); width:100%; max-width:400px; }
  .login-label { display:block; font-size:13px; color:var(--gray); margin-bottom:6px; font-weight:600; }
  .login-input { width:100%; padding:12px 16px; font-size:16px; border:2px solid var(--border); border-radius:10px; font-family:inherit; outline:none; transition:border-color 0.2s; margin-bottom:12px; }
  .login-input:focus { border-color:var(--primary); }
  .login-btn { width:100%; padding:13px; background:var(--primary); color:white; border:none; border-radius:10px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; transition:background 0.2s; }
  .login-btn:hover { background:#1d4ed8; }
  .login-btn:disabled { background:#94a3b8; cursor:default; }
  .login-btn.green { background:var(--green); }
  .login-btn.green:hover { background:#15803d; }
  .login-msg { margin-top:12px; padding:10px 14px; border-radius:8px; font-size:13px; display:none; }
  .login-msg.error { background:#fee2e2; color:var(--red); display:block; }
  .login-msg.info { background:var(--light-blue); color:var(--primary); display:block; }
  .login-back { background:none; border:none; color:var(--gray); font-size:13px; cursor:pointer; font-family:inherit; margin-top:10px; text-decoration:underline; }
  #login-step1, #login-step2 { }
  #login-step2 { display:none; }
  .step2-who { font-size:15px; font-weight:700; margin-bottom:16px; color:var(--dark); }

  /* ===== APP ===== */
  #app { display:none; }
  header { background:var(--dark); color:white; padding:10px 16px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:100; }
  header h2 { font-size:14px; font-weight:700; flex:1; }
  .user-badge { background:rgba(255,255,255,0.15); padding:4px 10px; border-radius:20px; font-size:12px; max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .score-badge { background:var(--primary); padding:4px 10px; border-radius:20px; font-size:12px; font-weight:700; white-space:nowrap; }
  .evo-badge { padding:4px 10px; border-radius:20px; font-size:12px; font-weight:700; white-space:nowrap; background:rgba(255,255,255,0.18); }

  /* ===== COMBO TOAST ===== */
  #combo-toast { position:fixed; top:70px; left:50%; transform:translateX(-50%) translateY(-20px); background:linear-gradient(135deg,#f97316,#ef4444); color:#fff; font-size:18px; font-weight:900; padding:10px 28px; border-radius:999px; box-shadow:0 4px 20px rgba(239,68,68,0.5); z-index:9999; opacity:0; pointer-events:none; transition:opacity 0.3s, transform 0.3s; white-space:nowrap; }
  #combo-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* ===== EVOLUTION OVERLAY ===== */
  #evo-overlay { position:fixed; inset:0; z-index:10000; display:flex; flex-direction:column; align-items:center; justify-content:center; background:radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%); opacity:0; pointer-events:none; transition:opacity 0.4s; }
  #evo-overlay.show { opacity:1; pointer-events:auto; }
  .evo-icon { font-size:100px; animation:evoBounce 0.6s ease; }
  .evo-label { font-size:14px; color:rgba(255,255,255,0.6); margin-top:16px; letter-spacing:2px; }
  .evo-name { font-size:42px; font-weight:900; color:#fff; margin-top:8px; text-shadow:0 0 30px rgba(251,191,36,0.8); }
  .evo-msg { font-size:16px; color:rgba(255,255,255,0.7); margin-top:12px; }
  @keyframes evoBounce { 0%{transform:scale(0.3) rotate(-15deg);opacity:0;} 60%{transform:scale(1.2) rotate(5deg);} 100%{transform:scale(1) rotate(0deg);opacity:1;} }
  @keyframes evoStar { 0%,100%{opacity:0;transform:scale(0);} 50%{opacity:1;transform:scale(1);} }
  .evo-stars { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .evo-star { position:absolute; border-radius:50%; animation:evoStar 1.2s ease infinite; }
  .evo-tap-hint { margin-top:32px; font-size:13px; color:rgba(255,255,255,0.35); }

  /* ===== TABS ===== */
  .tabs { display:flex; background:var(--card); border-bottom:1px solid var(--border); }
  .tab-btn { flex:1; padding:11px 4px; border:none; background:none; font-family:inherit; font-size:12px; cursor:pointer; color:var(--gray); border-bottom:3px solid transparent; transition:all 0.2s; white-space:nowrap; }
  .tab-btn.active { color:var(--primary); border-bottom-color:var(--primary); font-weight:700; }

  /* ===== FILTER ===== */
  .filter-bar { padding:10px 12px; background:var(--card); border-bottom:1px solid var(--border); display:flex; gap:6px; overflow-x:auto; flex-wrap:nowrap; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .filter-bar::-webkit-scrollbar { display:none; }
  .filter-btn { padding:6px 10px; border:2px solid var(--border); background:var(--bg); border-radius:20px; font-size:12px; cursor:pointer; font-family:inherit; color:var(--gray); transition:all 0.15s; font-weight:600; white-space:nowrap; flex-shrink:0; }
  .filter-btn.active { background:var(--primary); color:white; border-color:var(--primary); }

  /* ===== QUIZ ===== */
  main { padding:12px; max-width:800px; margin:0 auto; }
  .progress-bar { height:6px; background:var(--border); border-radius:3px; margin-bottom:6px; overflow:hidden; }
  .progress-fill { height:100%; background:var(--primary); border-radius:3px; transition:width 0.4s; }
  .progress-text { font-size:12px; color:var(--gray); text-align:right; margin-bottom:10px; }
  .question-card { background:var(--card); border-radius:14px; padding:16px; box-shadow:0 2px 8px rgba(0,0,0,0.06); margin-bottom:12px; }
  .q-meta { display:flex; gap:8px; margin-bottom:10px; align-items:center; flex-wrap:wrap; }
  .q-num { font-size:12px; color:var(--gray); }
  .q-lesson-tag { background:var(--light-blue); color:var(--primary); padding:2px 8px; border-radius:20px; font-size:12px; font-weight:700; }
  .q-text { font-size:15px; line-height:1.7; color:var(--dark); margin-bottom:16px; white-space:pre-line; }
  .options { display:flex; flex-direction:column; gap:9px; }
  .opt-btn { display:flex; align-items:flex-start; gap:10px; padding:11px 13px; background:var(--bg); border:2px solid var(--border); border-radius:10px; cursor:pointer; text-align:left; font-family:inherit; font-size:14px; line-height:1.6; transition:all 0.15s; color:var(--dark); width:100%; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  .opt-btn:hover:not([disabled]) { border-color:var(--primary); background:var(--light-blue); }
  .opt-letter { min-width:26px; height:26px; background:white; border:2px solid var(--border); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0; }
  .opt-btn.correct { border-color:var(--green); background:var(--light-green); }
  .opt-btn.correct .opt-letter { background:var(--green); border-color:var(--green); color:white; }
  .opt-btn.wrong { border-color:var(--red); background:var(--light-red); }
  .opt-btn.wrong .opt-letter { background:var(--red); border-color:var(--red); color:white; }
  .opt-btn[disabled] { cursor:default; }
  .explanation { margin-top:14px; padding:12px 14px; background:#fffbeb; border-left:4px solid var(--yellow); border-radius:0 8px 8px 0; font-size:13px; line-height:1.7; display:none; }
  .explanation.show { display:block; }
  .exp-title { font-weight:700; color:#92400e; margin-bottom:5px; font-size:12px; }
  #next-btn { width:100%; padding:13px; background:var(--green); color:white; border:none; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; display:none; transition:background 0.2s; margin-top:4px; position:sticky; bottom:12px; box-shadow:0 4px 16px rgba(22,163,74,0.3); touch-action:manipulation; }
  #next-btn:hover { background:#15803d; }
  #next-btn.show { display:block; }

  /* ===== WRONG LIST ===== */
  .section-wrap { padding:12px; max-width:800px; margin:0 auto; }
  .section-wrap h3 { font-size:15px; font-weight:700; margin-bottom:14px; }
  .wrong-item { background:var(--card); border-radius:12px; padding:14px; margin-bottom:10px; box-shadow:0 1px 4px rgba(0,0,0,0.05); }
  .wrong-item-q { font-size:13px; line-height:1.6; margin-bottom:8px; }
  .wrong-item-ans { font-size:13px; color:var(--green); font-weight:700; }
  .wrong-item-exp { font-size:12px; color:var(--gray); margin-top:5px; line-height:1.6; }
  .no-data { text-align:center; color:var(--gray); padding:40px; font-size:15px; }

  /* ===== STATS ===== */
  .stats-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:14px; }
  .stat-card { background:var(--card); border-radius:12px; padding:14px; text-align:center; box-shadow:0 1px 4px rgba(0,0,0,0.05); }
  .stat-num { font-size:26px; font-weight:700; color:var(--primary); }
  .stat-label { font-size:11px; color:var(--gray); margin-top:3px; }
  .lesson-stat { background:var(--card); border-radius:12px; padding:13px; margin-bottom:9px; box-shadow:0 1px 4px rgba(0,0,0,0.05); }
  .lesson-stat-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:7px; }
  .lesson-stat-bar { height:8px; background:var(--border); border-radius:4px; overflow:hidden; }
  .lesson-stat-fill { height:100%; border-radius:4px; transition:width 0.4s; }
  .reset-btn { width:100%; padding:11px; background:#fee2e2; color:var(--red); border:none; border-radius:10px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; margin-top:14px; touch-action:manipulation; }

  /* ===== LEADERBOARD GAME STYLE ===== */
  .lb-bg { background:linear-gradient(160deg,#0f172a 0%,#1e293b 60%,#0f172a 100%); min-height:100%; padding:16px 14px 32px; }
  .lb-top-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .lb-title { font-size:18px; font-weight:700; color:#fff; letter-spacing:1px; }
  .lb-refresh-btn { background:rgba(255,255,255,0.12); color:#cbd5e1; border:1px solid rgba(255,255,255,0.15); border-radius:20px; padding:5px 12px; font-size:12px; cursor:pointer; font-family:inherit; transition:background 0.2s; }
  .lb-refresh-btn:hover { background:rgba(255,255,255,0.2); }
  .lb-formula-pill { display:inline-block; background:rgba(147,51,234,0.2); border:1px solid rgba(147,51,234,0.4); color:#c4b5fd; border-radius:20px; padding:4px 12px; font-size:11px; margin-bottom:16px; }

  /* My rank banner */
  .my-banner { background:linear-gradient(135deg,#7c3aed,#4f46e5); border-radius:14px; padding:14px 16px; margin-bottom:16px; display:flex; align-items:center; gap:12px; box-shadow:0 4px 20px rgba(124,58,237,0.4); }
  .my-banner-icon { font-size:28px; }
  .my-banner-info { flex:1; }
  .my-banner-rank { font-size:13px; color:#c4b5fd; }
  .my-banner-score { font-size:22px; font-weight:700; color:#fff; }
  .my-banner-detail { font-size:11px; color:#a5b4fc; margin-top:2px; }

  /* Podium */
  .lb-podium { display:flex; align-items:flex-end; gap:8px; margin-bottom:16px; }
  .podium-card { flex:1; border-radius:16px; padding:14px 8px 12px; text-align:center; position:relative; animation:podiumIn 0.5s ease both; }
  .podium-card.p1 { background:linear-gradient(160deg,#f59e0b,#d97706); box-shadow:0 8px 24px rgba(245,158,11,0.5); padding-top:20px; }
  .podium-card.p2 { background:linear-gradient(160deg,#94a3b8,#64748b); box-shadow:0 6px 16px rgba(148,163,184,0.4); }
  .podium-card.p3 { background:linear-gradient(160deg,#cd7c3c,#92400e); box-shadow:0 6px 16px rgba(180,83,9,0.4); }
  .podium-crown { font-size:20px; position:absolute; top:-14px; left:50%; transform:translateX(-50%); }
  .podium-avatar { width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700; color:#fff; margin:0 auto 6px; border:3px solid rgba(255,255,255,0.4); }
  .podium-name { font-size:12px; font-weight:700; color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-bottom:4px; }
  .podium-score { font-size:20px; font-weight:700; color:#fff; }
  .podium-label { font-size:10px; color:rgba(255,255,255,0.7); }
  .podium-me-ring { box-shadow:0 0 0 3px #fff, 0 0 0 5px #7c3aed; }
  @keyframes podiumIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
  .podium-card.p1 { animation-delay:0.1s; }
  .podium-card.p2 { animation-delay:0.2s; }
  .podium-card.p3 { animation-delay:0.3s; }

  /* Rank list (4~10) */
  .lb-list { display:flex; flex-direction:column; gap:8px; }
  .lb-list-item { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:11px 14px; display:flex; align-items:center; gap:10px; animation:slideIn 0.4s ease both; }
  .lb-list-item.lb-me { background:rgba(79,70,229,0.25); border-color:rgba(129,140,248,0.5); }
  @keyframes slideIn { from { opacity:0; transform:translateX(20px); } to { opacity:1; transform:translateX(0); } }
  .lb-list-rank { min-width:28px; font-size:14px; font-weight:700; color:#64748b; text-align:center; }
  .lb-list-avatar { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; color:#fff; flex-shrink:0; }
  .lb-list-name { flex:1; font-size:13px; font-weight:700; color:#e2e8f0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lb-level { font-size:10px; padding:2px 7px; border-radius:10px; font-weight:700; margin-left:4px; }
  .lb-list-right { text-align:right; }
  .lb-list-score { font-size:17px; font-weight:700; color:#a78bfa; }
  .lb-list-detail { font-size:10px; color:#64748b; }
  .lb-loading { text-align:center; padding:40px; color:#64748b; font-size:14px; }

  /* ===== MODAL ===== */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:200; align-items:center; justify-content:center; padding:20px; }
  .modal-overlay.show { display:flex; }
  .modal { background:white; border-radius:16px; padding:24px 20px; max-width:340px; width:100%; text-align:center; }
  .modal-emoji { font-size:44px; margin-bottom:10px; }
  .modal-title { font-size:18px; font-weight:700; margin-bottom:6px; }
  .modal-sub { color:var(--gray); font-size:13px; margin-bottom:16px; }
  .modal-score { font-size:32px; font-weight:700; color:var(--primary); margin-bottom:4px; }
  .modal-btns { display:flex; gap:8px; }
  .modal-btn { flex:1; padding:11px; border:none; border-radius:10px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; touch-action:manipulation; }
  .modal-btn.primary { background:var(--primary); color:white; }
  .modal-btn.secondary { background:var(--bg); color:var(--dark); }

  button { touch-action:manipulation; -webkit-tap-highlight-color:transparent; }

  @media (max-width:600px) {
    header { padding:10px 14px; gap:8px; }
    header h2 { display:none; }
    main { padding:10px; }
    .question-card { padding:14px; }
    .q-text { font-size:14px; }
    .opt-btn { font-size:13px; padding:10px 11px; }
    .section-wrap { padding:10px; }
    .stats-section { padding:10px; }
    .stat-num { font-size:22px; }
    #login-screen h1 { font-size:22px; }
    #login-card { padding:24px 18px; }
  }
  @media (max-width:360px) {
    .stat-num { font-size:19px; }
    .q-text { font-size:13px; }
    .opt-btn { font-size:12px; }
    .lb-score { font-size:15px; }
  }
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="login-screen">
  <h1>📖 國中國文練習</h1>
  <p class="sub">陋室銘・鳥・深藍的憂鬱・秋之味<br>共 200 題，附解析 · 積分排行榜</p>
  <div id="login-card">
    <!-- Step 1: 輸入暱稱 -->
    <div id="login-step1">
      <label class="login-label" for="nickname-input">暱稱</label>
      <input type="text" id="nickname-input" class="login-input" placeholder="例：小明、7年3班" maxlength="20" autocomplete="off">
      <button class="login-btn" id="step1-btn" onclick="step1Next()">繼續 →</button>
      <div id="step1-msg" class="login-msg"></div>
    </div>
    <!-- Step 2: 密碼 -->
    <div id="login-step2">
      <div class="step2-who" id="step2-who"></div>
      <label class="login-label" for="password-input" id="pw-label">密碼</label>
      <input type="password" id="password-input" class="login-input" placeholder="請輸入密碼" maxlength="30" autocomplete="off">
      <input type="password" id="password-confirm" class="login-input" placeholder="再輸入一次確認" maxlength="30" autocomplete="off" style="display:none">
      <button class="login-btn green" id="step2-btn" onclick="step2Submit()">登入</button>
      <div id="step2-msg" class="login-msg"></div>
      <button class="login-back" onclick="backToStep1()">← 換一個暱稱</button>
    </div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app">
  <header>
    <h2>國文練習</h2>
    <span class="user-badge" id="user-badge">👤</span>
    <span class="evo-badge" id="evo-badge">🥚 書蟲蛋</span>
    <span class="score-badge" id="score-badge">✓ 0/0</span>
  </header>

  <!-- COMBO TOAST -->
  <div id="combo-toast">🔥 3 連勝！</div>

  <!-- EVOLUTION OVERLAY -->
  <div id="evo-overlay" onclick="closeEvoOverlay()">
    <div class="evo-stars" id="evo-stars"></div>
    <div class="evo-icon" id="evo-icon">🥚</div>
    <div class="evo-label">✨ 進化了！✨</div>
    <div class="evo-name" id="evo-name">書蟲蛋</div>
    <div class="evo-msg" id="evo-msg"></div>
    <div class="evo-tap-hint">點擊任意處繼續</div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('quiz')">📝 練習</button>
    <button class="tab-btn" onclick="switchTab('wrong')">❌ 錯題</button>
    <button class="tab-btn" onclick="switchTab('stats')">📊 成績</button>
    <button class="tab-btn" onclick="switchTab('rank')">🏆 排行榜</button>
  </div>

  <!-- QUIZ TAB -->
  <div id="tab-quiz">
    <div class="filter-bar">
      <button class="filter-btn active" onclick="setLesson('all')" data-lesson="all">全部</button>
      <button class="filter-btn" onclick="setLesson('陋室銘')" data-lesson="陋室銘">陋室銘</button>
      <button class="filter-btn" onclick="setLesson('鳥')" data-lesson="鳥">鳥</button>
      <button class="filter-btn" onclick="setLesson('深藍的憂鬱')" data-lesson="深藍的憂鬱">深藍的憂鬱</button>
      <button class="filter-btn" onclick="setLesson('秋之味')" data-lesson="秋之味">秋之味</button>
      <button class="filter-btn" onclick="setLesson('wrong')" data-lesson="wrong">🔁 錯題複習</button>
    </div>
    <main>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-text" id="progress-text"></div>
      <div class="question-card">
        <div class="q-meta">
          <span class="q-num" id="q-num"></span>
          <span class="q-lesson-tag" id="q-lesson-tag"></span>
        </div>
        <div class="q-text" id="q-text"></div>
        <div class="options" id="options-container"></div>
        <div class="explanation" id="explanation-box">
          <div class="exp-title">📌 解析</div>
          <div id="explanation-text"></div>
        </div>
      </div>
      <button id="next-btn" onclick="nextQuestion()">下一題 →</button>
    </main>
  </div>

  <!-- WRONG TAB -->
  <div id="tab-wrong" style="display:none">
    <div class="section-wrap">

const ALL_QUESTIONS = [{"id": 1, "lesson": "陋室銘", "question": "陋室銘：「山不在高，有仙則名；水不在深，有龍則靈。斯是陋室，惟吾德馨。」上述文句，是在強調什麼的重要性？", "options": {"A": "風景名勝，好山好水", "B": "天外飛仙，點石成金", "C": "珍禽異獸，奇花異草", "D": "君子固窮，才德揚名"}, "answer": "D", "explanation": "(Ｄ)以「山、水」比喻居室；以「仙、龍」比喻有品德、學識之人。說明只要有才德就能夠揚名"}, {"id": 2, "lesson": "陋室銘", "question": "「書不死記，理解就行；人不怕笨，勤學則明。斯是大考，惟吾拚命。」下列何者最適合當作這段文字的篇名？", "options": {"A": "教師銘", "B": "作弊銘", "C": "考試銘", "D": "陋室銘"}, "answer": "C", "explanation": "題幹強調了對考試的態度，包括書寫、理解、不怕笨，以及勤學的重要性。故選(Ｃ)"}, {"id": 3, "lesson": "陋室銘", "question": "下列出自陶淵明移居的詩句，何者與劉禹錫陋室銘中的「何陋之有」有異曲同工之妙？", "options": {"A": "懷此頗有年，今日從茲役", "B": "敝廬何必廣，取足蔽床席", "C": "鄰曲時時來，抗言談在昔", "D": "奇文共欣賞，疑義相與析"}, "answer": "B", "explanation": "(Ｂ)與題幹都強調了對簡樸生活環境的滿足和對物質的節制，展現了對淡泊清貧的追求。【選項語譯】：(Ａ)懷抱這個願望（移居南村）已經多年，今天才算把這件大事辦完(Ｂ)我的居所不需要太寬敞，只需滿足擺放床鋪的需求(Ｃ)鄰近的朋友經常來訪，共同回憶和討論過去的事情(Ｄ)看到奇文便一同欣賞，互相討論分析文章裡的疑義"}, {"id": 4, "lesson": "陋室銘", "question": "下列關於陋室銘文意的敘述，何者正確？", "options": {"A": "「南陽 諸葛廬，西蜀 子雲亭」：乃自比諸葛亮、揚雄，有恃才傲物的意味", "B": "「談笑有鴻儒，往來無白丁」：指交往的都是權勢之輩，沒有平民", "C": "「調素琴，閱金經」：表現生活富裕，悠閒自在", "D": "「苔痕上階綠，草色入簾青」：顯示出陋室有盎然的生氣，而不俗氣"}, "answer": "D", "explanation": "(Ａ)暗示自己和孔明、揚雄一樣有品德及才華，正靜時機，以期一展抱負(Ｂ)藉客人襯托主人的高雅(Ｃ)表現主人生活悠閒與風雅幽靜的生活品味，並不表示富裕"}, {"id": 5, "lesson": "陋室銘", "question": "有關陋室銘一文文句的詮釋，下列何者正確？", "options": {"A": "「可以調素琴，閱金經」──寫「書中自有黃金屋」的抱負", "B": "「談笑有鴻儒，往來無白丁」──寫「士為知己者死」的豪情", "C": "「苔痕上階綠，草色入簾青」──寫「門前冷落車馬稀」的落寞", "D": "「無絲竹之亂耳，無案牘之勞形」―─寫「是非紅塵不到我」的恬適"}, "answer": "D", "explanation": "(Ａ)表現主人生活悠閒與風雅幽靜的生活品味(Ｂ)藉由讚賞往來的人學問淵博，襯托主人的高雅脫俗，才德兼(Ｃ)寫陋室風光幽靜而生機蓬勃"}, {"id": 6, "lesson": "陋室銘", "question": "有關陋室銘一文的敘述，下列何者錯誤？", "options": {"A": "以「山不在高，有仙則名；水不在深，有龍則靈」貫串全文，有承上啟下作用", "B": "以「何陋之有」暗示作者自己抱負遠大，並以君子德行自期", "C": "以「南陽 諸葛廬，西蜀 子雲亭」暗示作者自己的德行、才幹可與諸葛亮、揚雄相提並論", "D": "讀完本文後，得到的啟示是：只要內涵豐富，物質的匱乏不算什麼"}, "answer": "A", "explanation": "(Ａ)「惟吾德馨」"}, {"id": 7, "lesson": "陋室銘", "question": "陋室銘以「何陋之有」來寄託「君子居之」的寓意，此寓意和下列何者最相近？", "options": {"A": "為學一首示子侄：吾資之昏，不逮人也；吾材之庸，不逮人也。旦旦而學之，久而不怠焉", "B": "愛蓮說：自李唐來，世人甚愛牡丹；予獨愛蓮之出淤泥而不染", "C": "賣油翁：康肅問曰：「汝亦知射乎？吾射不亦精乎？」翁曰：「無他，但手熟爾。」", "D": "五柳先生傳：好讀書，不求甚解，每有會意，便欣然忘食"}, "answer": "B", "explanation": "題幹和(Ｂ)皆寫自己的品德高尚"}, {"id": 8, "lesson": "陋室銘", "question": "劉禹錫 陋室銘中的文句，何者最能表達作者高雅的生活意趣？", "options": {"A": "山不在高，有仙則名；水不在深，有龍則靈", "B": "斯是陋室，惟吾德馨", "C": "苔痕上階綠，草色入簾青", "D": "可以調素琴，閱金經。無絲竹之亂耳，無案牘之勞形"}, "answer": "D", "explanation": "(Ａ)以山水仙龍為喻，說明只要有才德就可以有好名聲(Ｂ)說明自己雖居陋 室，卻是有德的君子(Ｃ)寫陋室風光幽靜而生機蓬勃"}, {"id": 9, "lesson": "陋室銘", "question": "劉禹錫以陋室銘一文來戒勉自己，其戒勉內容與下列何者最為相同？", "options": {"A": "「君子無所爭，必也射乎」，強調君子之爭應謙讓而不強調勝負", "B": "「士而懷居，不足以為士矣」，應該不在乎居住環境的簡陋，多充實學識，修養品德", "C": "「人不知而不慍，不亦君子乎」，要多多宣傳推銷自己的才能，這樣才會有機會為他人所用", "D": "「君子務本，本立而道生」，要先確立自己的本分所在，才有可能建立做人的準繩"}, "answer": "B", "explanation": "劉禹錫以陋室銘戒勉自己雖居陋室，仍要充實學識，修養品德，期望將來能有作為，故選(Ｂ)"}, {"id": 10, "lesson": "陋室銘", "question": "「孔子云：『何陋之有？』」這句話在陋室銘中有什麼隱含意義？", "options": {"A": "俗事煩人", "B": "知己難求", "C": "年華不再", "D": "君子居之"}, "answer": "D", "explanation": "(Ｄ)作者自居君子，認為道德修養可使陋室不陋"}, {"id": 11, "lesson": "陋室銘", "question": "「南陽 諸葛廬，西蜀 子雲亭。」是說明作者希望自己能夠如何？", "options": {"A": "自由自在，四處為家", "B": "居住豪宅，位居要津", "C": "學問淵博，飽讀詩書", "D": "靜待時機，一展抱負"}, "answer": "D", "explanation": "本處作者暗示自己和孔明、揚雄一樣有品德及才華，正靜待時機，以期一展抱負，名留青史，故選(Ｄ)"}, {"id": 12, "lesson": "陋室銘", "question": "「苔痕上階綠，草色入簾青」這二句營造出何種情境？", "options": {"A": "生意盎然", "B": "豪氣干雲", "C": "蕭索淒涼", "D": "恬靜淡雅"}, "answer": "A", "explanation": "(Ｂ)形容英雄氣概極盛"}, {"id": 13, "lesson": "陋室銘", "question": "下列各選項「　」中的文句說明，何者不恰當？", "options": {"A": "「斯是陋室，惟吾德馨」——只有住在陋室，主人才會有品德、才學", "B": "「無絲竹之亂耳，無案牘之勞形」——說明環境的幽雅清靜與主人不當官後的輕鬆自在", "C": "「談笑有鴻儒，往來無白丁」——襯托出主人的高雅脫俗，才德兼備", "D": "「孔子云：『何陋之有？』」——以君子自居，自信道德修養可以使陋室不陋"}, "answer": "A", "explanation": "(Ａ)只要主人有品德、才學，一樣可以使陋室聲名遠播。"}, {"id": 14, "lesson": "陋室銘", "question": "下列陋室銘中的各句，何者不是「對偶」句？", "options": {"A": "山不在高，有仙則名；水不在深，有龍則靈", "B": "斯是陋室，惟吾德馨", "C": "談笑有鴻儒，往來無白丁", "D": "調素琴，閱金經"}, "answer": "B", "explanation": "(Ｂ)「馨」由名詞轉品為動詞，為轉品修辭"}, {"id": 15, "lesson": "陋室銘", "question": "下列哪個選項所表現的情境和「草色入簾青」相似？", "options": {"A": "花徑不曾緣客掃", "B": "綠滿窗前草不除", "C": "藍田日暖玉生煙", "D": "吹面不寒楊柳風"}, "answer": "B", "explanation": "題幹與(Ｂ)皆描述了窗前綠意盎然，草木蓊鬱的情狀。"}, {"id": 16, "lesson": "陋室銘", "question": "下列對於陋室銘一文的分析，何者錯誤？", "options": {"A": "大致為隔句押韻，並大量運用對偶形式", "B": "以「斯是陋室」貫穿全文", "C": "開頭以「山不在高，有仙則名」說明自己是有德的君子", "D": "文末以諸葛亮、揚雄自比，並引聖人之言作結"}, "answer": "B", "explanation": "(Ｂ)以「惟吾德馨」貫穿全文"}, {"id": 17, "lesson": "陋室銘", "question": "教完陋室銘一課後，老師請同學回答作者在本文中引用「諸葛廬、子雲亭」的用意為何，下列何人的回答正確？", "options": {"A": "帕托：很想住在諸葛廬和子雲亭中", "B": "佩拉：表示自己談笑來往者皆為鴻儒", "C": "克拉拉：暗示自己靜待時機，一展抱負", "D": "杰帕德：為了紀念諸葛亮和揚雄的事蹟"}, "answer": "C", "explanation": ""}, {"id": 18, "lesson": "陋室銘", "question": "李毛想藉文學家來象徵班上人物的特質，下列敘述何者不恰當？", "options": {"A": "華建為了生活，什麼工作都肯做，甘為五斗米折腰，猶如「淵明第二」", "B": "丞琳沉醉於蓮花，可謂「今日濂溪」", "C": "雅軒熱愛品茶，真是「陸羽再世」", "D": "佑威思維清晰，能言善辯，堪稱「現代孟子」"}, "answer": "A", "explanation": ""}, {"id": 19, "lesson": "陋室銘", "question": "商湯盤銘：「苟日新，日日新，又日新。」有關「銘」的敘述，下列何者錯誤？", "options": {"A": "本則是簡短精要地提醒一個人要日新又新", "B": "銘是古體詩，一般皆屬不押韻的散文", "C": "我們通常在廟宇，或紀念性建築物皆可看到，類似這樣的警語或贊頌", "D": "陋室銘是劉禹錫戒勉自己要充實修養，雖居陋室，仍然可以安然自樂"}, "answer": "B", "explanation": "(Ｂ)銘是文體的一種，為誦讀方便，多數有押韻"}, {"id": 20, "lesson": "陋室銘", "question": "從陋室銘文末的「南陽 諸葛廬，西蜀 子雲亭」二句，可以看出作者的心境為何？", "options": {"A": "曲高和寡，孤芳自賞", "B": "隱居離群，與世隔絕", "C": "韜光養晦，靜待時機", "D": "居於平淡，甘於平凡"}, "answer": "C", "explanation": "引前賢作比，暗示自己同樣在靜待時機，以期一展抱負，故選(Ｃ)。(Ａ)曲高和寡：比喻言行卓越不凡，知音難求或作品艱深高妙，賞識者很少。孤芳自賞：比喻自命清高，自我欣賞"}, {"id": 21, "lesson": "陋室銘", "question": "詩云：「時人莫小池中水，淺處無妨有臥龍。」此與陋室銘中的哪一句意思相通？", "options": {"A": "斯是陋室，惟吾德馨", "B": "往來無白丁", "C": "無案牘之勞形", "D": "苔痕上階綠"}, "answer": "A", "explanation": "題幹與(Ａ)都表達了即使處於簡陋的環境，也有可能隱藏著不凡的人才或價值。其中「德馨」和「臥龍」都是指潛藏的優秀素質或才華。"}, {"id": 22, "lesson": "陋室銘", "question": "劉禹錫對處陋室的自得其樂，所表現的精神與下列何人不同？", "options": {"A": "揚雄於子雲亭寫經", "B": "陶淵明的「環堵蕭然，不蔽風日……晏如也」", "C": "顏回的「簞食瓢飲，居陋巷，不改其樂」", "D": "范仲淹的「先天下之憂而憂，後天下之樂而樂」"}, "answer": "D", "explanation": ""}, {"id": 23, "lesson": "陋室銘", "question": "關於陋室銘一文的敘述，下列何者正確？", "options": {"A": "屬於記敘文", "B": "本文押「ㄣ」韻，押韻的字有「名、靈、馨、青、丁、經、形、亭」八個字", "C": "「斯是陋室，惟吾德馨」引起全文", "D": "以「孔子云：『何陋之有？』」暗示君子的行徑"}, "answer": "D", "explanation": "(Ａ)應用文(Ｂ)押ㄥ韻(Ｃ)開頭四句引起全文"}, {"id": 24, "lesson": "陋室銘", "question": "下列文句，何者在靜態的描繪中兼具動態感？", "options": {"A": "橫看成嶺側成峰，遠近高低各不同", "B": "苔痕上階綠，草色入簾青", "C": "風雨襲來的時候，覆葉會抵擋", "D": "待到重陽日，還來就菊花"}, "answer": "B", "explanation": ""}, {"id": 25, "lesson": "陋室銘", "question": "關於陋室銘一文的說明，下列何者正確？", "options": {"A": "表現作者孤傲自許的性情", "B": "全文用典繁多，詞藻華麗", "C": "末尾引孔子之言引出君子之德自期", "D": "陋室不陋，且聲名遠播全因主人的交遊廣闊"}, "answer": "C", "explanation": "(Ａ)表達作者安貧樂道的生活態度(Ｂ)句式整齊有變，句式整齊有變(Ｄ)室不陋，且聲名遠播，是因主人的賢德"}, {"id": 26, "lesson": "鳥", "question": "鄭愁予：「小鳥跳響在枝上，如琴鍵的起落。」上句中鳥的情態，與下列何者最接近？", "options": {"A": "飛起來的時候才閃露一下斑斕的花彩", "B": "跳盪得那樣輕靈，腳上像是有彈簧", "C": "牠倏地振翅飛去，牠不回顧，牠不徘徊", "D": "有的一聲長叫，包括著六、七個音階；有的只是一個聲音，圓潤而不覺其單調"}, "answer": "B", "explanation": "題幹與(Ｂ)皆是描述鳥跳盪的輕靈之美。"}, {"id": 27, "lesson": "鳥", "question": "鳥：「我想牠的苦悶，大概是僅次於黏在膠紙上的蒼蠅；牠的快樂，大概是僅優於在標本室裡住著罷？」這段文字的含義為何？", "options": {"A": "以籠中鳥的苦悶，反諷人類的自私", "B": "感嘆養鳥的人少，知音難尋的苦悶", "C": "形容籠中鳥居住環境優渥、飲食無憂", "D": "愛鳥人愛屋及烏，連蒼蠅和製成標本的鳥類也一併關心"}, "answer": "A", "explanation": "題幹採用反諷筆法，寫籠中鳥的苦悶，故選(Ａ)。"}, {"id": 28, "lesson": "鳥", "question": "鳥：「一直等到夜晚，才又聽到杜鵑叫，由遠叫到近，由近叫到遠，一聲急似一聲，竟是淒絕的哀樂。客夜聞此，說不出的酸楚！」作者感到酸楚的原因為何？", "options": {"A": "對籠中鳥的苦悶感到心酸", "B": "因單身夜晚孤獨寂寥有感", "C": "流落外地思念故鄉的心情", "D": "對杜鵑的叫聲反感所導致"}, "answer": "C", "explanation": "「客夜聞此」點出離鄉之苦，故選(Ｃ)。"}, {"id": 29, "lesson": "鳥", "question": "「美的事實，就在我們的四周，甚至醜陋之中，也蘊藏著美麗；不起眼裡，也包含著神奇。毛蟲形體雖醜，色彩卻斑斕耀眼；蜂鳥小如拇指，卻有空中停飛的本事。這些全賴有心欣賞，有暇觀照之人才能領略。」下列哪一句最適合當作本文題目？", "options": {"A": "點滴留心皆是美", "B": "良辰美景奈何天", "C": "美是心中有愛", "D": "有缺陷才可愛"}, "answer": "A", "explanation": "題幹旨在說明美的事實常常存在於我們的四周，需要我們用心去發現、欣賞，故選(Ａ)。(Ｂ)指縱有令人愜意的美好的時光，美麗的景色，卻沒有欣賞的心思。出自湯顯祖　牡丹亭。"}, {"id": 30, "lesson": "鳥", "question": "鳥：「真是減一分則太瘦、增一分則太肥那樣地穠纖合度」，可與下列哪一段話相互參照？", "options": {"A": "細瘦而不乾癟，豐腴而不臃腫", "B": "跳盪得那樣輕靈，腳上像是有彈簧", "C": "世界上的生物，沒有比鳥更俊俏的", "D": "有的曳著長長的尾巴，有的翹著尖尖的長喙"}, "answer": "A", "explanation": "題幹與(Ａ)皆在描述鳥恰到好處的形體之美"}, {"id": 31, "lesson": "鳥", "question": "鳥：「有時候『一行白鷺上青天』，背後還襯著黛青的山色和釉綠的梯田。」此句充滿色彩美與動態感，下列寫景的詩句，何者亦是如此？", "options": {"A": "水光瀲灩晴方好，山色空濛雨亦奇", "B": "花開紅樹亂鶯啼，草長平湖白鷺飛", "C": "遠上寒山石徑斜，白雲深處有人家", "D": "江雨霏霏江草齊，六朝如夢鳥空啼"}, "answer": "B", "explanation": "(Ｂ)「紅樹」、「白鷺」具色彩美，「亂鶯啼」、「白鷺飛」具動態感。"}, {"id": 32, "lesson": "鳥", "question": "下列有關梁實秋鳥一文的敘述，何者正確？", "options": {"A": "全文扣緊「客夜聞此，說不出的酸楚」這句話來描寫", "B": "細膩描寫鳥鳴聲與形體美，表現作者對鳥的愛惜之情", "C": "文中描述籠中鳥的情形，主要是在暗示休閒的重要性", "D": "作者主要是用動物學的觀點真實描寫各種鳥類的叫聲"}, "answer": "B", "explanation": "(Ａ)我愛鳥(Ｃ)自由的可貴(Ｄ)音樂的觀點。"}, {"id": 33, "lesson": "鳥", "question": "鳥：「有時候稻田裡佇立著一隻白鷺，拳著一條腿，縮著頸子；有時候『一行白鷺上青天』，背後還襯著黛青的山色和釉綠的梯田。」有關這段文句的描寫手法說明，下列選項何者最為正確？", "options": {"A": "由遠處寫到近處", "B": "由小物寫到大物", "C": "由空間寫到時間", "D": "由靜態寫到動態"}, "answer": "D", "explanation": "(Ｄ)「有時候稻田裡佇立著一隻白鷺，拳著一條腿，縮著頸子」靜態，「有時候『一行白鷺上青天』，背後還襯著黛青的山色和釉綠的梯田」動態"}, {"id": 34, "lesson": "鳥", "question": "鳥一文開頭以「我愛鳥」三字自成一段，最後以不忍看籠裡的鳥作結，表現出什麼樣的效果？", "options": {"A": "令人意猶未盡，回味無窮", "B": "表達哀傷，倍增內心酸楚", "C": "自然真切，真實如在眼前", "D": "連環呼應，表達愛鳥之情"}, "answer": "D", "explanation": "(Ｄ)開頭以「我愛鳥」表達出作者對鳥的熱愛，最後以不忍看籠裡的鳥作結，以首尾連環呼應，強調了作者的愛鳥情感。"}, {"id": 35, "lesson": "鳥", "question": "下列出自鳥一文的句子，何者最能看出鳥瞵視昂藏的神情？", "options": {"A": "牠高踞枝頭，臨風顧盼", "B": "牠倏地振翅飛去，牠不回顧，牠不徘徊", "C": "曳著長長的尾巴，翹著尖尖的長喙", "D": "不知名的小鳥，在枝頭跳躍"}, "answer": "A", "explanation": "(Ａ)臨風顧盼指迎著風向四處張望。形容志得意滿，神采飛揚的樣子"}, {"id": 36, "lesson": "鳥", "question": "有關鳥一文的文句說明，下列何者正確？", "options": {"A": "「腳上像是有彈簧」描寫鳥跳動的技巧高深莫測", "B": "「在標本室裡住著」是指生病的鳥可住在溫室中", "C": "「牠像虹似地一下就消逝了」形容鳥飛行時的羽色有如彩虹", "D": "「如果想要『搏扶搖而直上』，便要撞頭碰壁」寫籠中鳥沒有自由"}, "answer": "D", "explanation": "(Ａ)跳動的輕靈(Ｂ)被製成標本(Ｃ)飛走快速。"}, {"id": 37, "lesson": "鳥", "question": "鳥：「牠像虹似地一下就消逝了，牠留下的是無限的迷惘。」關於上述文字的意涵，下列何者最正確？", "options": {"A": "敘述人們對鳥的深情迷戀，使得鳥捨不得飛離此地", "B": "暗示作者賞鳥仍意猶未盡，於是四處尋找鳥的蹤跡", "C": "說明鳥的羽毛色彩繽紛如彩虹，人很容易被其吸引", "D": "描寫鳥快速離去，同時表現人對鳥飛去的惆悵之情"}, "answer": "D", "explanation": "從「牠像虹似地一下就消逝了」可知鳥消失的速度像迅速消失的彩虹；而從「牠留下的是無限的迷惘」可知鳥的離去讓人感到惆悵，故選(Ｄ)。"}, {"id": 38, "lesson": "鳥", "question": "下列出自鳥的文句，何者最能看出作者具有仁民愛物的胸懷？", "options": {"A": "冬天還有遮風的棉罩，十分地「優待」", "B": "一行白鷺上青天", "C": "再令人觸目的就是那些偶然一見的囚在籠裡的小鳥兒了，但是我不忍看", "D": "牠的快樂，大概是僅優於在標本室裡住著罷"}, "answer": "C", "explanation": "(Ｃ)寫出作者對鳥的悲憫之情"}, {"id": 39, "lesson": "鳥", "question": "鳥：「自從離開四川以後，不再容易看見那樣多型類的鳥的跳盪，也不再容易聽到那樣悅耳的鳥鳴」關於這段文句的解讀，下列何者正確？", "options": {"A": "顯示人與鳥之間的契合", "B": "感嘆難再欣賞鳥的美好", "C": "表現作者愛鳥的仁愛之心", "D": "寫鳥振翅離去的堅決快速"}, "answer": "B", "explanation": "題幹說明作者自從離開四川後，因環境的不同，無法再看見鳥兒的美麗神態。也藉此感嘆過去美好已不復見，故選(Ｂ)"}, {"id": 40, "lesson": "鳥", "question": "鳥一文中，梁實秋以「腳上像是有彈簧」來描寫鳥的何種特色？", "options": {"A": "跳盪的輕靈", "B": "飛行的快速", "C": "鳥鳴的音樂性", "D": "鳥的色彩之美"}, "answer": "A", "explanation": "形容鳥跳盪的輕靈之美，故選(Ａ)"}, {"id": 41, "lesson": "鳥", "question": "下列文句，何者最通順且沒有語病？", "options": {"A": "我這邊多想變成一隻小鳥，在高空裡快活地飛翔", "B": "可愛的小鳥給一全家人的生活，增添了許多樂趣", "C": "春風一吹來，小鳥兒果然又成群從南方飛回來了", "D": "鳥有時停在枝上，有時在空中張開翅膀展翅高飛"}, "answer": "C", "explanation": "(Ａ)宜刪「這邊」(Ｂ)「一」、「全」擇一刪(Ｄ)「張開翅膀」、「展翅」擇一刪。"}, {"id": 42, "lesson": "鳥", "question": "教完鳥一文後，老師請同學說明鳥一課的寫作風格，下列何人的回答正確？", "options": {"A": "阿蘭：字詞冷僻，晦澀難懂", "B": "玲可：文筆飄逸，氣象萬千", "C": "佩拉：文句典雅，條理分明", "D": "銀狼：觀察入微，充滿感情"}, "answer": "D", "explanation": "作者細膩觀察鳥的各個面向，表達對鳥的憐愛，故選(Ｄ)。(Ａ)冷僻：罕見的。多指字、名稱、典故、書籍等。晦澀：詩文、樂曲等含意隱晦不易懂"}, {"id": 43, "lesson": "鳥", "question": "下列有關鳥一文的內容說明，何者說明正確？", "options": {"A": "作者是將烏鴉的叫聲比喻做「淒絕的哀樂」", "B": "作者用「腳上像有彈簧」形容鳥的色彩之美", "C": "「好銳利的喜悅刺上我的心頭」是因聽到鳥悅耳的叫聲", "D": "文末「但是我不忍看」最能看出作者對於鳥的惻隱之心"}, "answer": "D", "explanation": "(Ａ)杜鵑的叫聲(Ｂ)跳盪的輕靈，具動態美(Ｃ)看到鳥兒高踞枝頭，臨風顧盼。"}, {"id": 44, "lesson": "鳥", "question": "娜塔莎因為醫療疏失被醫院開除後，心情十分沮喪。她的弟弟為了幫助她走出陰霾，帶著她到處旅行。某晚，娜塔莎聽到一聲急似一聲，淒絕的杜鵑叫聲，有感而發地說了：「客夜聞此，說不出的酸楚！」請問，娜塔莎說的這句話情境近於下列何者？", "options": {"A": "八千里路雲和月", "B": "夜半鐘聲到客船", "C": "只緣身在此山中", "D": "孤帆遠影碧山盡"}, "answer": "B", "explanation": "題幹與(Ｂ)皆在表達思鄉愁緒"}, {"id": 45, "lesson": "鳥", "question": "鳥：「等到旭日高升，市聲鼎沸，鳥就沉默了」本句隱含何種涵義？", "options": {"A": "暗示城市的喧囂繁華，使自然環境受到了影響", "B": "寫鳥離去的快速，也表達出對鳥飛去的惆悵之情", "C": "敘述籠中鳥的可憐與苦悶，強調作者對鳥的愛惜", "D": "說明鳥鳴牽動作者的思鄉愁緒，心中感到格外酸楚"}, "answer": "A", "explanation": "題幹表達了在城市中，當陽光升起，市區的喧囂聲音開始增加，鳥兒也因此而沉默。表現人鳥生活環境重疊，暗示城市的繁華和喧囂對自然環境的影響，故選(Ａ)"}, {"id": 46, "lesson": "鳥", "question": "「一展翅便驚動了呼喝的狂飆／從背後一陣陣追到／錯愕的雲來不及閃躲／天空已斜了過來／旋成一盤又一盤漩渦／大地在翼下也旋著／一雙翻滾的小陀螺。」請問這一首詩，是在歌詠哪一種鳥禽？", "options": {"A": "白鷺", "B": "鳶鷹", "C": "鴟梟", "D": "杜鵑"}, "answer": "B", "explanation": "出處：余光中 鷹。(Ｂ)從「旋」等關鍵字判斷"}, {"id": 47, "lesson": "鳥", "question": "「山林中，西風吹拂，蘆葦□□地響著，一群老鷹□□飛過，水澤中群鳥□□價響，飛入蘆叢裡，形成一幅生動的畫面。」缺空處依序宜填入下列何組詞語？", "options": {"A": "嘩嘩、轉瞬、格格", "B": "轆轆、頃刻、嘩嘩", "C": "窸窣、倏地、格格", "D": "淅瀝、少間、蕭蕭"}, "answer": "C", "explanation": "(Ｃ)「窸窣」表示細微的聲音，適合描述蘆葦地響著的聲音；「頃刻」表示短暫的時間，合適描述老鷹飛過的瞬間；「嘩嘩」則表示喧鬧的聲音，適合描述群鳥的響動。"}, {"id": 48, "lesson": "鳥", "question": "鳥：「等到旭日高升，市聲鼎沸，鳥就沉默了，不知到哪裡去了」隱含什麼意思？", "options": {"A": "鳥鳴雖然嘈雜，但鳥本身卻喜歡在安靜的地方生活", "B": "鳥鳴被喧鬧的人聲蓋過，表示人類占去了鳥類的生活空間", "C": "旭日高升後，鳥類怕人類捕捉，逃得無影無蹤", "D": "旭日高升後，鳥類就不敢出聲，深怕曝露行跡"}, "answer": "B", "explanation": ""}, {"id": 49, "lesson": "鳥", "question": "鳥：「有時是獨奏，有時是合唱，簡直是一派和諧的交響樂。」這段文字給人何種感受？", "options": {"A": "高興愉悅", "B": "平和寧靜", "C": "喧譁嘈雜", "D": "憂思失意"}, "answer": "A", "explanation": "形容鳥聲如音樂一般，帶給自己愉悅的盈耳之感，故選(Ａ)"}, {"id": 50, "lesson": "鳥", "question": "「夫妻本是同林鳥，大限來時各自飛。」這句話是說明夫妻遇到困難時是採取何種態度？", "options": {"A": "相得益彰", "B": "禍福與共", "C": "自求多福", "D": "大度包容"}, "answer": "C", "explanation": "題幹比喻夫妻本是一時的伴侶，遇有危險之時，只能各奔前程，自求多福，故選(Ｃ)靠自己的能力求取福祿。(Ａ)互相輔助、配合，以完成某種事物。(Ｂ)一同度過苦難也一同分享快樂(Ｄ)度量寬宏能包容他人。"}, {"id": 51, "lesson": "鳥", "question": "根據鳥一文，下列何人的行為最符合作者愛鳥的觀點？", "options": {"A": "波莉：只欣賞自然中的鳥，不囚禁也不要捕捉", "B": "喬治：用圖鑑辨別鳥類並認真研究鳥類的習性", "C": "小金：不隨意放生進口鳥類破壞原有地的生態", "D": "佩佩：給家中文鳥最高級食物、為籠子裝風扇"}, "answer": "A", "explanation": "由課文中「令人觸目的就是那些偶然一見的囚在籠裡的小鳥兒了，但是我不忍看」可知選(Ａ)。"}, {"id": 52, "lesson": "鳥", "question": "鳥：「不知是什麼東西驚動牠了，牠倏地振翅飛去，牠不回顧，牠不徘徊，牠像虹似地一下就消逝了，牠留下的是無限的迷惘。」關於本句的說明，下列何者恰當？", "options": {"A": "振翅飛去，告訴讀者做事要果決果斷", "B": "以虹喻鳥，表達美麗的事物快速消散", "C": "用不回顧、不徘徊暗示人生也是如此", "D": "無限的迷惘，表達找不到目標的遺憾"}, "answer": "B", "explanation": "(Ｂ)虹和鳥都是美麗的事物，且都快速地不見。"}, {"id": 53, "lesson": "鳥", "question": "公主馬馥雅亡國後逃跑到了北漢去，請根據鳥一文推斷，此時旅居他鄉的馬公主，最怕聽到哪一種鳥叫聲？", "options": {"A": "杜鵑", "B": "白鷺", "C": "烏鴉", "D": "鴟梟"}, "answer": "A", "explanation": "(Ａ)會發出類似「不如歸去」的叫聲，令人想起家鄉"}, {"id": 54, "lesson": "鳥", "question": "鳥一文：「不知有多少個春天的早晨，這樣的鳥聲把我從夢境喚起。」意近於下列何者？", "options": {"A": "春眠不覺曉，處處聞啼鳥", "B": "春水碧於天，畫船聽雨眠", "C": "千里鶯啼綠映紅，水村山郭酒旗風", "D": "落紅不是無情物，化作春泥更護花"}, "answer": "A", "explanation": "【選項語譯】(Ａ)春意綿綿正好睡覺，不知不覺天亮了，醒來後處處聽到鳥兒啼叫的聲音(Ｂ)春水非常碧綠，水和天連成一色，在裝飾華麗的船上聽著雨點落入水面的聲音入眠(Ｃ)千里江南，黃鶯啼叫聲中一片綠葉映襯著紅花，水邊村落、山邊城鎮的酒旗迎風飄揚(Ｄ)凋零的落花，並不是選擇無情的離開，而是將落花變成肥沃的泥土，用來滋養綻放的花兒"}, {"id": 55, "lesson": "鳥", "question": "幾米在微笑的魚中提到：「我送一隻魚回家，回到真正的家。」請問，依照梁實秋認為「鳥就是要自由在在地飛翔在天地間」的邏輯判斷，接下來應該是如何接續描述？", "options": {"A": "她搖著尾巴，滑入一望無際的大海", "B": "我跟著一隻發著綠光的魚，遊蕩在午夜的街頭", "C": "樹林裡真適合玩躲貓貓的遊戲", "D": "一隻被囚禁在大魚缸裡的小魚"}, "answer": "A", "explanation": "魚真正的家是大海，故選(Ａ)"}, {"id": 56, "lesson": "鳥", "question": "下列「　」中的語詞，哪一組詞意相同？", "options": {"A": "鳥在枝頭上跳躍，一副「神氣」的模樣／偶爾一次考一百分，有什麼好「神氣」的", "B": "晚餐過後，桌上杯盤「狼藉」／不要跟這個聲名「狼藉」的明星混在一起", "C": "週日三五好友相約去烏來「泡湯」／這次清境農場之旅因為颱風導致的道路中斷而「泡湯」了", "D": "有美為人向來八面「玲瓏」，面面俱到／這塊水晶「玲瓏」剔透，非常好看"}, "answer": "A", "explanation": "(Ａ)得意傲慢的樣子(Ｂ)散亂／敗壞(Ｃ)洗溫泉／落空(Ｄ)聰明伶俐／精巧"}, {"id": 57, "lesson": "鳥", "question": "關於鳥一文的敘述何者錯誤？", "options": {"A": "因物抒情的文章，全文流露出作者對鳥深切的喜愛", "B": "一開始就明確指出「我愛鳥」藉此點出主旨", "C": "作者先描寫鳥的形體再描寫鳥的鳴叫聲", "D": "最後一段呼應「我愛鳥」說明人應順應鳥的習性，尊重生命，和大自然和平相處"}, "answer": "C", "explanation": "(Ｃ)先寫鳥鳴再寫鳥的形體美"}, {"id": 58, "lesson": "鳥", "question": "鳥：「竟是淒絕的哀樂。」此句中的「絕」字，其詞性與下列何者相同？", "options": {"A": "一片鳥「囀」", "B": "「高」踞枝頭", "C": "提籠架「鳥」", "D": "和「諧」的交響樂"}, "answer": "B", "explanation": "題幹與(Ｂ)副詞，(Ａ)(Ｃ)名詞(Ｄ)形容詞"}, {"id": 59, "lesson": "鳥", "question": "「等到旭日高升，市聲鼎沸，鳥就沉默了，不知到哪裡去了。」從這句話可以推論人和鳥隱含何種關係？", "options": {"A": "鳥類體貼人類活動而讓位", "B": "人類與鳥類生活空間重疊", "C": "人類和鳥類的作息時間相反", "D": "鳥類被人類訓練累了而休息"}, "answer": "B", "explanation": "「市聲鼎沸，鳥就沉默了」表示當人類開始大量活動時，鳥就消失了，可推論人類與鳥類生活空間重疊， 因此人類活動時鳥類會躲藏或離開，故選(Ｂ)"}, {"id": 60, "lesson": "鳥", "question": "作者喜愛鳥，但鳥一文最後寫道：「但是我不忍看。」請問作者用意為何？", "options": {"A": "因為會讓作者回想起他的四川老家", "B": "感嘆能見到的鳥類已經愈來愈少了", "C": "會讓作者想起他以前養的鳥", "D": "因為他愛鳥，不忍心看到失去自由的籠中鳥"}, "answer": "D", "explanation": "作者於最後不忍看的是「偶然一見的囚在籠裡的小鳥兒」，可知他「不忍看」是不忍心看見喜愛的鳥失去自由的可憐樣貌，故選(Ｄ)"}, {"id": 61, "lesson": "秋之味", "question": "行秋在段考前召開讀書會，下列大家對於梁實秋 鳥一文的寫作主旨及手法敘述，何人正確？", "options": {"A": "辛焱：採用開門見山法來寫作，也可稱為埋兵伏將法", "B": "雷澤：寫作時序的進行，為過去—現在—過去", "C": "凝光：作者用大量篇幅描寫鳥兒生活的的苦悶", "D": "甘雨：由「不忍看」三字，可見作者的愛鳥、憐鳥"}, "answer": "D", "explanation": "(Ａ)也可稱為「破題法」(Ｂ)記敘順序為「現在→過去→現在」(Ｃ)以大量篇幅寫寫鳥鳴聲與形體之美。"}, {"id": 62, "lesson": "秋之味", "question": "在國文課堂上，老師要全班同學分組，並針對梁實秋鳥一文提出分析報告。下列四組的報吿提要中的說明，何者完全正確？", "options": {"A": "第一組：用反諷筆法，寫出鳥看似優待，其實可憐又苦悶的待遇", "B": "第二組：針對不同的鳥，深入探討，不僅指出其飲食習慣，更說明牠們的生活習性", "C": "第三組：杜鵑鳥的描寫和春天聯結在一起，表現出季節的美好", "D": "第四組：作者認為每一隻鳥都有自己的型體樣貌，但是有些鳥體態過度臃腫"}, "answer": "A", "explanation": "(Ｂ)未寫及飲食習慣(Ｃ)鳥一文中將杜鵑的鳥鳴聲與思鄉愁緒連結(Ｄ)作者認為鳥的體態穠纖合度，恰到好處"}, {"id": 63, "lesson": "鳥", "question": "小賀老師教到鳥一文：「我感覺興味的不是那人的悠閒，卻是那鳥的苦悶。」問各位同學作者寫這段話的用意，請問誰的回答正確？", "options": {"A": "小帥：作者嫉妒別人的悠閒，心裡的苦悶就如同籠中鳥", "B": "大同：作者對於鳥類受苦，有很高的興致", "C": "心潔：作者悲天憫人，對於鳥的感情尤其如此", "D": "貝爾：作者缺乏同理心，所以無法感受到他人的快樂"}, "answer": "C", "explanation": ""}, {"id": 64, "lesson": "陋室銘", "question": "義男新居落成，在其門上張貼陋室銘的：「南陽 諸葛廬，西蜀 子雲亭」。請問義男可能懷有何種心思？", "options": {"A": "表達憤世嫉俗的處事態度", "B": "待時機成熟，一展抱負", "C": "想隱居離群，與世隔絕", "D": "表達居平淡，甘平凡的想法"}, "answer": "B", "explanation": "(Ｂ)想效法揚雄和孔明等待機會，為人所用"}, {"id": 65, "lesson": "陋室銘", "question": "段考將近，同學們開設Line群組討論陋室銘，請問哪一位同學說錯了？", "options": {"A": "霍霍：全文多以散文形式書寫，隔句押韻", "B": "白露：全文雖然篇幅極短卻包含議論、寫景、抒情", "C": "符玄：前六句點題，且以「斯是陋室，惟吾德馨」為全文綱領", "D": "羅剎：以山水仙龍為喻，說明自己雖居陋室卻是有德君子"}, "answer": "A", "explanation": "(Ａ)多以韻文形式"}, {"id": 66, "lesson": "陋室銘", "question": "導遊向遊客介紹劉禹錫的一生，其中談到了其著名作品陋室銘。請問下列哪一項導遊介紹錯了？", "options": {"A": "「惟吾德馨」意指陋室不陋是因為只要品德優異，自然就會聲名遠播，增添了陋室的光采", "B": "「苔痕上階綠，草色入簾青」形容房子周圍的景色，一片綠意盎然", "C": "「談笑有鴻儒，往來無白丁」，表達來往皆有學問之人，無粗野鄙人之輩", "D": "「無絲竹之亂耳，無案牘之勞形」，指平常公務繁忙，嚮往悠閒自在的生活"}, "answer": "D", "explanation": "(Ｄ)形容無公務纏身的輕鬆自在"}, {"id": 67, "lesson": "陋室銘", "question": "世人常以桃花源來形容大同世界，下列四句皆出自陋室銘，其中所描述的情景，何者最貼近桃花源記「夾岸數百步，中無雜樹，芳草鮮美，落英繽紛」的情境？", "options": {"A": "斯是陋室，惟吾德馨", "B": "苔痕上階綠，草色入簾青", "C": "無絲竹之亂耳，無案牘之勞形", "D": "南陽 諸葛廬，西蜀 子雲亭"}, "answer": "B", "explanation": "題幹是形容綠意盎然，百花齊放之貌，故選(Ｂ)"}, {"id": 68, "lesson": "陋室銘", "question": "少曦發現中國古代的許多文人，如「何陋之有」的孔子，在居貧困時卻不被打敗，反而創作出許多膾炙人口的作品。下列各位名人對自身的評論，何者亦可見其貧困生活？", "options": {"A": "陶淵明：環堵蕭然，不蔽風日，短褐穿結，簞瓢屢空——晏如也", "B": "柳宗元：千山鳥飛絕，萬徑人蹤滅。孤舟蓑笠翁，獨釣寒江雪", "C": "周敦頤：噫！菊之愛，陶後鮮有聞。蓮之愛，同予者何人？牡丹之愛，宜乎眾矣", "D": "雍正皇帝：漆園非所慕，適志即逍遙。千載勛名身外影，百歲榮辱鏡中花"}, "answer": "A", "explanation": "(Ｂ)寫其孤寂卻寧靜自由的心境(Ｃ)寫其不流於俗的高潔人格(Ｄ)表達雍正皇帝恬淡自持的心境"}, {"id": 69, "lesson": "陋室銘", "question": "同學玩「說書人」桌遊，必須要說出劉禹錫在陋室銘中要表達的文意，下列何人說錯了，成為輸家？", "options": {"A": "靜香：「草色入簾青」寫出陋室的草木盎然，綠意十足", "B": "大雄：「往來無白丁」描述主人的交友對象都不是等閒之輩", "C": "小夫：「無案牘之勞形」寫出面對繁雜公務時要用悠閒的態度去處理", "D": "胖虎：「何陋之有」隱含外表的缺陷不足以掩蓋心靈的真善美"}, "answer": "C", "explanation": "(Ｃ)形容無公務纏身的輕鬆自在"}, {"id": 70, "lesson": "深藍的憂鬱", "question": "「就像深藍電腦已化身為人形的傢伙在揶揄我。」句中的「揶揄」不適宜用下列哪個詞語替代？", "options": {"A": "譏諷", "B": "嘲弄", "C": "調謔", "D": "謳歌"}, "answer": "D", "explanation": "(Ｄ)歌詠以頌功德"}, {"id": 71, "lesson": "深藍的憂鬱", "question": "關於深藍的憂鬱一文的內容與寫作手法分析，以下敘述何者錯誤？", "options": {"A": "採主觀者的敘述角度為文", "B": "情節中刻意安排棋王與深藍在棋藝與情感表達上造成強烈對比", "C": "深藍對植入晶片的棋王取得最後的勝利而心有不甘，興起報復的念頭", "D": "深藍因遭遇失敗而興起的情緒反應，令電腦科學家們大為振奮"}, "answer": "C", "explanation": "(Ｃ)深藍對於失敗的結果感到莫大悲傷而放聲大哭"}, {"id": 72, "lesson": "深藍的憂鬱", "question": "深藍的憂鬱一文，作者以「深藍的憂鬱」為篇名，主要的目的是什麼？", "options": {"A": "取英文意譯，藍色即具有憂鬱的意涵", "B": "呼應情節氛圍，預示故事悲劇性的結局", "C": "借喻代表科技的深藍遭代表人類的棋王打敗的憂傷", "D": "象徵深藍電腦顯露人類情感的劃時代突破"}, "answer": "D", "explanation": ""}, {"id": 73, "lesson": "深藍的憂鬱", "question": "深藍的憂鬱一文中，棋王因為與深藍對弈的慘敗，因而「信心全失，沮喪得無地自容直想自殺」。倘若想以一句話來勸勉棋王，下列何者較為適當？", "options": {"A": "人生得意須盡歡，莫使金樽空對月", "B": "花開堪折直須折，莫待無花空折枝", "C": "山重水複疑無路，柳暗花明又一村", "D": "黑髮不知勤學早，白首方悔讀書遲"}, "answer": "C", "explanation": "(Ａ)勉人及時行樂(Ｂ)勉人把握時機(Ｃ)勉人樂觀看待橫逆，放下得失，也許能絕處逢生，忽現轉機(Ｄ)勉人惜時進取，發憤勤學"}, {"id": 74, "lesson": "深藍的憂鬱", "question": "在深藍的憂鬱一文中，為何深藍的設計者在結局的時候會頻頻叫好？", "options": {"A": "為人類終於擊敗電腦而感到驕傲", "B": "對突破晶片科技發展而感到開心", "C": "因發現電腦運算弱點而感到欣慰", "D": "為電腦開始擁有情感而感到興奮"}, "answer": "D", "explanation": ""}, {"id": 75, "lesson": "深藍的憂鬱", "question": "「電腦即將接管世界了！人類的智慧還有用嗎？」這是作者面對棋王被深藍擊敗時所發出的呼喊，其中的意涵為何？", "options": {"A": "讚嘆世界發展的快速", "B": "期許科技帶來的方便", "C": "感嘆人類智慧的不足", "D": "憂慮人工智慧的發展"}, "answer": "D", "explanation": "此句是憂心於人工智慧的高度發展對人類社會的影響，與可能會面臨的問題，故選(Ｄ)"}, {"id": 76, "lesson": "陋室銘", "question": "「不戚戚於貧賤，不汲汲於富貴。」這句話所呈現的精神，與下列何者最接近？", "options": {"A": "蓬門敝戶可安居，簞食瓢飲亦怡然", "B": "奢者富而不足，何如儉者貧而有餘", "C": "君子之道，居勞苦則能忍，處富樂則能謙", "D": "以積貨財之心積學問，以求功名之心求道德"}, "answer": "A", "explanation": "題幹與(Ａ)皆表達不慕榮利、安貧的態度。【題幹語譯】對於貧窮卑賤不感到憂愁，對於財富權貴不努力求取。這是安貧、不慕榮利的態度。【選項語譯】(Ａ)即便是門戶破舊，也能安居；即便是粗茶淡飯，心裡也是怡然自在(Ｂ)奢侈的人，即使富有也深感不足，還不如節儉的人，雖然貧窮卻覺得有餘(Ｃ)一個君子，在勞苦的時候能夠忍耐，在富裕安樂時懂得謙虛(Ｄ)飛黃騰達的人，見了這些山峰就會停止追求名利的欲望；整天忙著處理政事的人，看了這些幽谷就會流連忘返。"}, {"id": 77, "lesson": "深藍的憂鬱", "question": "關於深藍的憂鬱一文的內容，下列敘述何者不正確？", "options": {"A": "文中偏重科幻色彩，對於人文精神鮮少著墨", "B": "敘述世界棋王與深藍電腦對弈的過程", "C": "棋王仰賴電腦晶片而勝過深藍電腦", "D": "表現出人類對未來科技的想像與運用"}, "answer": "A", "explanation": "(Ａ)兼具科幻色彩與人文精神，頗具發人深省之處"}, {"id": 78, "lesson": "深藍的憂鬱", "question": "關於深藍的憂鬱一文的情節，下列敘述何者不正確？", "options": {"A": "情節開始：寫世界棋王與深藍電腦對弈失敗後的心境", "B": "情節發展：對電腦即將超越人類智慧感到憂心忡忡", "C": "情節轉折：世界棋王在腦部植入晶片打算再與深藍對決", "D": "情節結局：描述世界棋王最終仍輸給深藍電腦的慘境"}, "answer": "D", "explanation": "(Ｄ)描述世界棋王再度與深藍對弈的情境，最終前者獲勝"}, {"id": 79, "lesson": "深藍的憂鬱", "question": "下列是深藍的憂鬱一文的內容，若根據行文邏輯將本文排列順序，下列選項何者正確？ 1.對電腦即將超越人類智慧產生憂慮 2.世界棋王與深藍電腦對弈失敗的心境 3.世界棋王在腦部植入晶片打算再戰深藍 4.世界棋王再度對弈深藍", "options": {"A": "1234", "B": "2134", "C": "2341", "D": "3421"}, "answer": "B", "explanation": ""}, {"id": 80, "lesson": "深藍的憂鬱", "question": "根據深藍的憂鬱一文的情節，下列哪一句表現出人類對人工智慧發展的高度憂慮？", "options": {"A": "電腦即將接管世界了！人類的智慧還有用嗎", "B": "你可以變得更聰明，你可以打敗深藍", "C": "我展開了難得的微笑，心中長久的陰霾隨之消散", "D": "下一次比賽後的勝利歡呼，全人類也都在熱烈鼓掌"}, "answer": "A", "explanation": "(Ｂ)(Ｃ)(Ｄ)透過棋王想像對戰勝利後的場景，顯現出棋王及全人類對贏過電腦的渴望"}, {"id": 81, "lesson": "深藍的憂鬱", "question": "關於深藍的憂鬱一文的情節，文末「成功了！成功了！機器有了情感！」是指為何？", "options": {"A": "設計者成功讓機器人產生情感而欣喜", "B": "外形俊俏更勝真男人", "C": "對弈不再是百戰百勝", "D": "深藍不願意再當電腦"}, "answer": "A", "explanation": ""}, {"id": 82, "lesson": "鳥", "question": "「又聞子規啼夜月，愁空山」中，以子規的啼叫聲襯托出思鄉的情感。下列詩句中，何者也表達了相同的情感？", "options": {"A": "眾鳥高飛盡，孤雲獨去閒", "B": "山光悅鳥性，潭影空人心", "C": "在天願為比翼鳥，在地願為連理枝", "D": "已怪杜鵑鳥，先來山下啼"}, "answer": "D", "explanation": "題幹和(Ｄ)皆表達思鄉的情感(Ａ)烘托出詩人孤獨自處的幽獨心情(Ｂ)悠閒自在的心境(Ｃ)愛情的堅貞"}, {"id": 83, "lesson": "深藍的憂鬱", "question": "深藍的憂鬱一文情節中，試問「第十次打敗我這個赫赫有名的世界棋王」中的棋王，後來是怎麼扳回一城？", "options": {"A": "每天不斷的苦練棋藝，堅持不懈", "B": "與其他人類研究深藍的思維", "C": "棋王決定在身體植入晶片", "D": "因為深藍電腦有了情感"}, "answer": "C", "explanation": "由課文中棋王決定於腦部植入超級計算能力的電腦晶片之行為，可知選(Ｃ)"}, {"id": 84, "lesson": "深藍的憂鬱", "question": "關於深藍的憂鬱一文的寫作手法分析，下列何者有誤？", "options": {"A": "故事採取追憶法，營造緊張刺激的氛圍", "B": "起初，特別點出棋王與深藍對情緒上反應的不同", "C": "結尾處，刻意寫出深藍變得像人類，有情緒反應", "D": "情節轉折處在棋王決定在身體植入晶片，並贏得棋局"}, "answer": "A", "explanation": "(Ａ)並非追憶法"}, {"id": 85, "lesson": "深藍的憂鬱", "question": "深藍的憂鬱中提到「電腦即將接管世界了！人類的智慧還有用嗎？」試問這句話要說明的是下列何者？", "options": {"A": "人類發明了人工智慧，卻有可能被取而代之", "B": "電腦的智慧深不可測，是人類預測不到的", "C": "電腦比人類更擅長冷靜分析及面對問題", "D": "電腦會模仿人類，最終會越來越像人類"}, "answer": "A", "explanation": "(Ａ)人類對於人工智慧發展抱持著憂慮，故將憂患意識展露於此"}, {"id": 86, "lesson": "深藍的憂鬱", "question": "下列有關深藍的憂鬱一文的情節敘述，何者有誤？", "options": {"A": "棋王對於自己棋局輸給深藍十次，痛苦不已", "B": "扭轉情勢是因為棋王選擇植入電腦晶片", "C": "深藍因棋局輸給棋王產生了如人類的情緒", "D": "深藍最後輸給棋王是因為太過粗心大意"}, "answer": "D", "explanation": "(Ｄ)本文並未提及深藍是否粗心大意，棋王獲勝是因為依靠植入的電腦晶片"}, {"id": 87, "lesson": "深藍的憂鬱", "question": "深藍的憂鬱一文中，作者安排棋王經歷「於腦部植入超級計算能力的電腦晶片後，決定再次與深藍電腦交手」的轉折後，才贏了深藍，是要透露什麼訊息？", "options": {"A": "歷經十戰十輸，呈現棋王堅忍不拔的性格", "B": "最終無法分辨到底是電腦還是人類贏", "C": "彰顯科技的高端，竟可以扭轉劣勢", "D": "人類的智慧終究還是超越電腦"}, "answer": "B", "explanation": "因為棋王腦部植入晶片，某部分也變成電腦，在此留了一個懸念，故選(Ｂ)"}, {"id": 88, "lesson": "深藍的憂鬱", "question": "棋局輸了的深藍說「老兄！別……別叫我電腦！」、「我應該比你更像人類唷！」這兩句話的涵義為何？", "options": {"A": "深藍對於比賽輸了，產生了如人類般的情感反應", "B": "因為深藍對於棋賽越來越著迷，並且沉迷棋局", "C": "深藍的外表英俊挺拔，相當人模人樣", "D": "深藍的智慧遠遠勝過身為人類的棋王"}, "answer": "A", "explanation": "由這兩句話可看出深藍對比賽勝負的在意，表現出了如同人類一般的強烈情緒，故選(Ａ)"}, {"id": 89, "lesson": "深藍的憂鬱", "question": "黃海對於科幻小說的定義是：「以科學為基礎，探索未來或未知情景的小說。」下列何人對科幻小說的解釋與之最相近？", "options": {"A": "阮梅：追求科學的新世界，因為陌生所以有獨特的美感", "B": "藿藿：故事著重描寫現實生活中無法體驗到的另外一個世界", "C": "寒鴉：描寫的最主要部分是「想像」，是不可能、不可思議的故事", "D": "雪衣：幻想起點建立在科學上，是由科學與幻想架構成的虛構故事"}, "answer": "D", "explanation": "題幹與(Ｄ)皆說明以科學作為故事基礎並探索未來或未知的情景。"}, {"id": 90, "lesson": "深藍的憂鬱", "question": "深藍的憂鬱一文中，世界棋王因比賽失利而鬱鬱寡歡，可以用下列何句來激勵他？", "options": {"A": "想匆匆忙忙地去完成一件事以期達到加快速度的目的，結果總是要失敗的", "B": "人們常以為犯小過無傷大雅，哪知更大的失敗常是由小過導引而來的", "C": "當人們感到自己沒有能力獲得巨大的成功時，他們會鄙視偉大的目標", "D": "人生求勝的祕訣，只有那些失敗過的人才瞭若指掌"}, "answer": "D", "explanation": "(Ｄ)這句話強調透過失敗，人才能夠更深刻地理解成功的道路，因此可以用來激勵世界棋王，鼓勵他從失利中學習與成長。"}, {"id": 91, "lesson": "深藍的憂鬱", "question": "在深藍的憂鬱一文中，何者是深藍電腦研發過程中最關鍵性的一步？", "options": {"A": "可以打敗人類的棋王", "B": "外型跟人類幾乎一樣", "C": "執行具危險性的工作", "D": "產生似人的情感反應"}, "answer": "D", "explanation": ""}, {"id": 92, "lesson": "深藍的憂鬱", "question": "深藍的憂鬱一文中，棋王最終能贏過深藍電腦的關鍵為何？", "options": {"A": "深藍電腦有了意識後暴走", "B": "棋王發現了必勝的對弈技巧", "C": "棋王在腦中植入電腦晶片", "D": "棋王與深藍聯手欺騙世人"}, "answer": "C", "explanation": ""}, {"id": 93, "lesson": "深藍的憂鬱", "question": "深藍的憂鬱一文中，主角為了打敗深藍，接受了科學家朋友什麼建議？", "options": {"A": "閉關精進棋藝", "B": "改造自己的四肢", "C": "在腦部植入晶片", "D": "破壞深藍的運作"}, "answer": "C", "explanation": ""}, {"id": 94, "lesson": "深藍的憂鬱", "question": "下列有關深藍的憂鬱一文的說明，何者正確？", "options": {"A": "是科幻極短篇小說", "B": "採用第三人稱寫作", "C": "文中以科學家與棋王為主角", "D": "敘事平舖直述，情節單純"}, "answer": "A", "explanation": "(Ｂ)以第一人稱寫作(Ｃ)主角為棋王與深藍電腦(Ｄ)情節懸疑、有轉折。"}, {"id": 95, "lesson": "深藍的憂鬱", "question": "下列對深藍的憂鬱的文句解說，何者正確？", "options": {"A": "我常常在夢裡看到一個全身藍色衣服的翩翩少年站在我前面：棋王對於自己不斷敗給深藍十分在意", "B": "悲傷蟄伏許多日子後，電腦科學家朋友王文燦提供一個點子：顯示科學家對人類大腦無盡的好奇心", "C": "面對的是一個可敬可怕的對手，卻不是人類：棋王一直對即將到來的比賽感到驚慌", "D": "銀亮的頭髮有著高貴的氣質，配上他俊挺的臉龐，更顯得聰慧不凡：以深藍出眾的外貌對比作者的可鄙"}, "answer": "A", "explanation": "(Ｂ)王文燦提供作者變聰明的方法(Ｃ)呼應前文人們對人工智慧的擔心，且棋王應是期待和深藍再次交手(Ｄ)並無此意。"}, {"id": 96, "lesson": "深藍的憂鬱", "question": "「電腦即將接管世界了！人類的智慧還有用嗎？」根據深藍的憂鬱一文，科學家發出此警告的原因為何？", "options": {"A": "對電腦的進步感到興奮期待", "B": "激勵自我充實跟上時代腳步", "C": "憂心人類將被電腦取代", "D": "對於科技的進步感到無可奈何"}, "answer": "C", "explanation": "這段話顯現人類對於科技的進步感到恐慌， 面臨電腦即將超越人類智慧這樣 的危機，充滿著各種憂慮與不確 定感，故選(Ｃ)"}, {"id": 97, "lesson": "深藍的憂鬱", "question": "根據深藍的憂鬱文中所述，下列何者正確？", "options": {"A": "棋王自始至終對於比賽結果都淡然處之", "B": "深藍是機器，故始終無法擁有人的情感", "C": "棋王腦中植入晶片後，深藍飲恨於棋王", "D": "文中對棋王的勝與負都有進行心理描寫"}, "answer": "C", "explanation": "(Ａ)並無淡然，棋王屢次失敗後，信心全失，沮喪得無地自容(Ｂ)深藍最後擁有人類情感(Ｄ)並未對「勝」進行心理描寫。"}, {"id": 98, "lesson": "深藍的憂鬱", "question": "關於深藍的憂鬱一文的寫作安排，下列何者說明正確？", "options": {"A": "人工智慧與人腦的對決結果仍是人腦大勝", "B": "深藍電腦自始至終都讓棋王難以望其項背", "C": "希望引起科技與人文之間平衡的討論思潮", "D": "深藍的外型酷似人類，是全文最後的高潮"}, "answer": "C", "explanation": "(Ａ)棋王經過改造，已不能完全代表「人腦」(Ｂ)結局是被棋王打敗了(Ｄ)全文高潮是深藍有了情感。"}, {"id": 99, "lesson": "深藍的憂鬱", "question": "「『電腦即將接管世界了！人類的智慧還有用嗎？』全世界的媒體和科學家多少年前就發出驚人的警告和疑問。」依上文推論，媒體和科學家提出此警告的用意為何？", "options": {"A": "電腦過度的濫用", "B": "人類智慧的退化", "C": "電腦將取代人類", "D": "人類科技的停滯"}, "answer": "C", "explanation": ""}, {"id": 100, "lesson": "深藍的憂鬱", "question": "「我已信心全失，沮喪得無地自容，只好偃旗息鼓，一個人躲在沒人知道的地方，放聲哭泣。」關於這段話的解釋，下列何者正確？", "options": {"A": "凸顯出電腦在輸棋後的沮喪", "B": "呈現人類在電腦前的無助感", "C": "敘述科學家在研發時的挫折", "D": "刻劃棋王植入晶片後的懊悔"}, "answer": "B", "explanation": "(Ａ)凸顯棋王輸棋後的沮喪(Ｃ)(Ｄ)文中並未提及。"}, {"id": 101, "lesson": "深藍的憂鬱", "question": "根據深藍的憂鬱一文，下列有關科學家王文燦為何要建議棋王植入晶片的解釋，何者最有可能？", "options": {"A": "單純為了協助棋王獲勝", "B": "想測試電腦有沒有情感", "C": "為了打敗敵對的科學家", "D": "要趁機行銷自家的晶片"}, "answer": "B", "explanation": "(Ａ)主要是為了試驗電腦有無情感(Ｃ)(Ｄ)文中並未提及。"}, {"id": 102, "lesson": "深藍的憂鬱", "question": "深藍的憂鬱：「我常常在夢裡看到一個全身藍色衣服的翩翩少年站在我前面，絮絮叨叨說些我聽不懂的話。就像深藍電腦已化身為人形的傢伙在揶揄我，對著我指指點點。」請問在上述棋王的夢境中，反映出下列何者？", "options": {"A": "深藍電腦即將投胎轉世成人", "B": "棋王敗給了深藍電腦而極度不安", "C": "棋王與深藍電腦有語言上的隔閡", "D": "深藍電腦化為人形來教訓失敗者"}, "answer": "B", "explanation": "(Ｂ)由題幹可見被深藍打敗是棋王內心巨大的創傷，並成為棋王的夢魘"}, {"id": 103, "lesson": "深藍的憂鬱", "question": "關於深藍的憂鬱一文的寫作手法，下列敘述何者恰當？", "options": {"A": "以倒敘法的方式記錄棋王與深藍電腦的對弈過程", "B": "藉由作者的夢境，表達當前人類對人工智慧的憂慮", "C": "透過植入電腦晶片的棋王戰勝深藍電腦的結局表示電腦將取代人類", "D": "棋王經由努力後打敗深藍，暗喻天下無難事，只怕有心人的道理"}, "answer": "B", "explanation": "(Ａ)順敘法，且未記敘對弈的過程(Ｃ)引發關於人工智慧機器人與人類關係的思考(Ｄ)棋王不是透過精進棋藝來打敗深藍，而是透過植入晶片，並無「天下無難事，只怕有心人」的意涵。"}, {"id": 104, "lesson": "深藍的憂鬱", "question": "關於深藍的憂鬱一文的情節，下列何人的說明最正確？", "options": {"A": "申鶴：深藍預計會與世界棋王再對弈十次", "B": "胡桃：深藍輸了比賽之後難過地放聲痛哭", "C": "鍾離：棋王對深藍電腦的高超棋藝甘拜下風", "D": "行秋：最後棋王認為自己已是人類而放棄獎盃"}, "answer": "B", "explanation": "(Ａ)深藍與棋王已比賽10次，而非未來還會對弈10次(Ｃ)棋王感到挫敗、沮喪而且不甘心(Ｄ)文中未提及。"}, {"id": 105, "lesson": "深藍的憂鬱", "question": "下列何者最適合作為深藍的憂鬱一文的註解？", "options": {"A": "當人工智慧發展到極致，機器人與人的差別為何", "B": "須培養運動家的精神：勝不驕、敗不餒，不斷進步", "C": "人性的無情、冷血與不擇手段，比機器人還可怕", "D": "機器人與人工智慧持續的進步，增加了人類的福祉"}, "answer": "A", "explanation": "本文藉由越來越像人類的機器人深藍與裝了電腦晶片的棋王比賽，表達出人類與機器人之間差異的省思，故選(Ａ)。"}, {"id": 106, "lesson": "深藍的憂鬱", "question": "(甲)棋王植入晶片(乙)深藍打敗棋王(丙)深藍進化為人形(丁)深藍大敗痛哭。依深藍的憂鬱中的情節發展脈絡，下列組合何者正確？", "options": {"A": "乙甲丙丁", "B": "甲乙丙丁", "C": "丁甲丙乙", "D": "丙丁甲乙"}, "answer": "A", "explanation": ""}, {"id": 107, "lesson": "深藍的憂鬱", "question": "看完深藍的憂鬱一文，希露瓦將整理寫下有關「科幻小說」的特色，請問她寫錯下列何者？", "options": {"A": "故事的時空背景經常超乎現實", "B": "故事背景須以當代社會為主，進而提出實際的建議", "C": "作品常寄託著作者對科學或哲學的省思", "D": "雖然是想像中的科學，但也常是人類對未來的目標"}, "answer": "B", "explanation": "(Ｂ)不一定要以當代社會為背景，科幻小說更常以超乎現實的想像作為時空背景。"}, {"id": 108, "lesson": "深藍的憂鬱", "question": "姬子想藉由網際網路資料檢索系統，蒐羅有關作家黃海相關資料，請問她可鍵入哪些相關字？", "options": {"A": "黃炳煌、科幻小說、中山文藝獎", "B": "鄉土文學作家、濁水溪筆記", "C": "臺灣文學獎新詩金典獎、閩南語寫詩", "D": "吳三連文藝散文獎、田園之秋"}, "answer": "A", "explanation": ""}, {"id": 109, "lesson": "深藍的憂鬱", "question": "下列「　」中的顏色字，何者用法與「深藍電腦」的「藍」字一樣為實指？", "options": {"A": "當「紅」偶像", "B": "「金」玉良言", "C": "近朱者「赤」", "D": "「白」費力氣"}, "answer": "C", "explanation": "題幹中的「藍」為實指，藍色之意，(Ａ)受人注目、受歡迎的(Ｂ)珍貴(Ｃ)紅色(Ｄ)徒然。"}, {"id": 110, "lesson": "深藍的憂鬱", "question": "「『科幻』是『科學幻想』的簡稱，經常以想像中的科學作為內容要素，設定故事架構。故事的時空背景經常超乎現實，甚至發生在宇宙的某個角落，反映作者對於科技世界的想像。」根據上述說明，下列何者最不符合科幻情節？", "options": {"A": "乖乖地在火星殖民地過著「機器人」的生活，從事開墾建設的工作", "B": "全身藍色衣服的翩翩少年站在我前面，絮絮叨叨說些我聽不懂的話", "C": "深藍電腦已經進步到有著人類形體的外貌和四肢，可以自由走動說話", "D": "在我的腦部植入超級計算能力的電腦晶片後，我決定與深藍電腦再一次交手"}, "answer": "B", "explanation": ""}, {"id": 111, "lesson": "深藍的憂鬱", "question": "關於深藍的憂鬱一文的敘述，下列何者正確？", "options": {"A": "棋王從頭到尾都沒贏過電腦", "B": "棋王最後因對弈輸棋而大哭", "C": "深藍因多次贏得比賽而瞧不起棋王", "D": "棋王為了贏過電腦而在腦中植入晶片"}, "answer": "D", "explanation": "(Ａ)棋王在植入晶片後獲勝(Ｂ)深藍最後因輸棋而大哭(Ｃ)文中並未提及。"}, {"id": 112, "lesson": "深藍的憂鬱", "question": "「全身穿著藍色系列的衣服，眼眸顯示出迷人的晶藍，銀亮的頭髮有著高貴的氣質，配上他俊挺的臉龐，更顯得聰慧不凡。」這段話運用了何種感官摹寫？", "options": {"A": "視覺摹寫", "B": "聽覺摹寫", "C": "觸覺摹寫", "D": "嗅覺摹寫"}, "answer": "A", "explanation": "(Ａ)這段話運用了視覺摹寫，通過描述外貌特徵如衣服顏色、眼眸的顏色、頭髮的質地、臉龐的特徵等，讓讀者在心中形成對該人物外貌的視覺印象。"}, {"id": 113, "lesson": "秋之味", "question": "「吹著涼風浴暖陽，再品嘗秋天賜予的好禮，忍不住要嘆，哎！這人生。」以上文句表達什麼感受？", "options": {"A": "感傷於季節的美好只能獨享", "B": "對秋日美好卻短暫感到失落", "C": "勞動帶來豐收的感動", "D": "肆意享受人生的美好"}, "answer": "D", "explanation": "(Ｄ)作者敘寫食物變得美味，以及氣候宜人，來讚嘆秋日適合享樂。"}, {"id": 114, "lesson": "秋之味", "question": "學完秋之味後，定延也想仿作一篇作文，透過食物歌頌秋日，下列何者最適合作為文章選材？", "options": {"A": "橘子", "B": "芒果", "C": "青梅", "D": "荔枝"}, "answer": "A", "explanation": ""}, {"id": 115, "lesson": "秋之味", "question": "秋之味文中作者說明吃蘿蔔時說：「常常吃著便不由得要感恩」，可推測作者應具有下列何種性格？", "options": {"A": "惜福愛物", "B": "明察秋毫", "C": "矯揉造作", "D": "砥志礪行"}, "answer": "A", "explanation": "(Ｂ)比喻能洞察一切，看出極細微的地方(Ｃ)裝腔作勢，刻意做作(Ｄ)磨鍊志節和品行。"}, {"id": 116, "lesson": "秋之味", "question": "在秋之味的文章最後，作者說：「最後一個屬於秋的節氣終於過完，我卻仍然眷戀著愉悅感官的，甜美的秋天況味」表現何種心情寫照？", "options": {"A": "表達對秋日的美好無比沉溺、眷戀", "B": "表達對冬天即將來臨的畏懼", "C": "凸顯季節交替的傷逝之嘆", "D": "沉溺於自欺欺人的幻想氛圍"}, "answer": "A", "explanation": ""}, {"id": 117, "lesson": "秋之味", "question": "秋之味：「切白蘿蔔時忍不住邊切邊吃。很難拒絕蘿蔔那辛辣中的清甜誘惑，生吃尤顯滋味」關於這段話的詮釋，下列說明何者正確？", "options": {"A": "作者藉由實際行動，表現蘿蔔的誘人美味", "B": "作者不喜歡蘿蔔的辛辣滋味", "C": "生吃蘿蔔味道會由甜轉辣，風味特殊，作者難以拒絕", "D": "蘿蔔生吃比煮熟具有更高的營養價值"}, "answer": "A", "explanation": ""}, {"id": 118, "lesson": "秋之味", "question": "「一年之中就數這個季節天時地利最適合享樂，奈何韶光短促，奈何手邊總有丟不掉的煩雜事。」上文中，作者連用兩次「奈何」，下列何者是最可能的原因？", "options": {"A": "感嘆秋日美好與來去匆匆", "B": "說明人生無常的無可奈何", "C": "強調人生苦短要及時行樂", "D": "哀傷生活不能由自己做主"}, "answer": "A", "explanation": "由「最適合享樂」可知其美好，由「韶光短促」可知時節短暫，而「手邊總有丟不掉的煩雜事」則是對比秋日雖美好，但無法完全好好享受的無奈，故選(Ａ)。"}, {"id": 119, "lesson": "秋之味", "question": "秋之味一文中，何者是鍾怡雯首次發現季節轉換為秋季的事件？", "options": {"A": "上課之外，大部分時間對著金黃陽光出神", "B": "某日清晨，我躺在地上練瑜伽，沁涼空氣中飄來隱約的熟甜之氣", "C": "夏天易爛的葉菜類存放時間變長了", "D": "根莖類如蘿蔔、蓮藕、馬鈴薯變得更甘脆"}, "answer": "B", "explanation": ""}, {"id": 120, "lesson": "秋之味", "question": "秋之味一文的寫作手法應為下列何者？", "options": {"A": "夾敘夾議", "B": "託物抒情", "C": "借事說理", "D": "詠物言志"}, "answer": "B", "explanation": ""}, {"id": 121, "lesson": "秋之味", "question": "「矮几上的文旦漸漸少了，像用剩的秋日，而煩雜事卻愈堆愈高。時序立冬，最後一個屬於秋的節氣終於過完，我卻仍然眷戀著愉悅感官的，甜美的秋天況味。」這段文句的意涵是什麼？", "options": {"A": "文旦味美但總會吃完，作者感到惋惜", "B": "秋天工作效率高，可趁機處理雜事", "C": "秋天無比美好，雖已消逝仍令人回味", "D": "立冬之後，就要拋棄延宕的壞習慣"}, "answer": "C", "explanation": "由「我卻仍然眷戀著愉悅感官的，甜美的秋天況味」可知選(Ｃ)。"}, {"id": 122, "lesson": "秋之味", "question": "秋之味中，作者藉由日常事物的觀察，觀照內心的變化，體察自身與自然環境，與周遭事物的連結，形成一篇描繪細膩的文章，我們可以用下列哪一個選項來說明之？", "options": {"A": "放下一切世俗紛擾後，往往就看得清楚所欲追求的目標", "B": "不知道艱苦的人，就沒有真正的幸福生活", "C": "這世界並不缺少美，而是缺少發現", "D": "痛苦和寂寞對年輕人是一劑良藥，它們不僅使靈魂更美好，更崇高，還保持了它青春的色澤"}, "answer": "C", "explanation": ""}, {"id": 123, "lesson": "秋之味", "question": "秋之味：「剛來臺灣時不很明白，為什麼單只秋季如此？」上句在秋之味文中的主要作用為何？", "options": {"A": "說明作者對於臺灣的無知", "B": "引起讀者好奇帶出下文", "C": "反襯出其他季節的無趣", "D": "貫串全文的綱領"}, "answer": "B", "explanation": "以心境為何對秋日有所波動之疑問，引起讀者的好奇及帶出下文，故選(Ｂ)"}, {"id": 124, "lesson": "秋之味", "question": "秋之味一文的主旨為何？", "options": {"A": "在秋天可以品嘗甜美多汁的文旦，是件幸福的事", "B": "時蔬瓜果必須要有正確的存放及料理方式", "C": "透過品味食物來感受秋天氣息，及心境的變化", "D": "韶光短促，秋季蕭瑟，人生充滿無奈及煩惱"}, "answer": "C", "explanation": ""}, {"id": 125, "lesson": "秋之味", "question": "秋之味一文中，作者提及「矮几上的文旦漸漸少了，像用剩的秋日，而煩雜事卻愈堆愈高」其用意應為下列何者？", "options": {"A": "呈現蔬果不當季的影響", "B": "暗藏春日將至的憧憬與期盼", "C": "凸顯秋日的美好及短暫", "D": "說明對人事變遷的感慨"}, "answer": "C", "explanation": "以文旦的減少暗示秋季 將盡，以煩雜事的積累，凸顯了秋日的無比美好。故選(Ｃ)"}, {"id": 126, "lesson": "秋之味", "question": "秋之味：「放著放著，酸澀隨著水分蒸發，突然有一天，轉為甜熟之味。是了，這是秋天。天地間盈滿一種甜的，專屬於秋的成熟氣息。」作者寫作這段文字的用意，最可能是下列何者？", "options": {"A": "舉例說明，指一到秋天，凡事都會由酸澀轉為甜熟", "B": "承上啟後，表達了作者熱愛秋天，讚美秋天的情懷", "C": "呼應題目，說明了「秋之味」就是一種成熟的氣味", "D": "總結全文，抒寫秋天的甜熟之味，讓作者回味無窮"}, "answer": "C", "explanation": "從「專屬於秋的成熟氣息」可知秋天具備一種獨有的成熟氣味，呼應題目「秋之味」，故選(Ｃ)。"}, {"id": 127, "lesson": "秋之味", "question": "「心極靜極沉，像一只熟得恰好的紅柿，一串黃到巔峰的香蕉，水分飽脹的秋梨，滿樹棲止的黃葉，我亦化身秋物，在短暫的秋裡憩息。」請問上文「紅柿」、「香蕉」、「秋梨」、「黃葉」的共同特色，並不包括下列何項？", "options": {"A": "都是秋天的景物", "B": "都有沉靜的氛圍", "C": "皆是作者的最愛", "D": "都代表已然成熟"}, "answer": "C", "explanation": "(Ｃ)題幹中未提及作者是否喜愛。"}, {"id": 128, "lesson": "秋之味", "question": "關於秋之味一課的寫作手法，下列何者正確？", "options": {"A": "仔細敘寫如何食用文旦，凸顯其美味", "B": "秋季來臨的線索為太陽光線的轉變", "C": "運用對比凸顯不能免除煩雜事的煩惱", "D": "書寫各種嗅覺、味覺的經驗鋪陳全文"}, "answer": "D", "explanation": "(Ａ)未仔細書寫食用文旦(Ｂ)以文旦味道的轉變作為線索(Ｃ)「一年之中就數這個季節天時地利最適合享樂，奈何韶光短促，奈何手邊總有丟不掉的煩雜事。」是以感嘆的口吻表現其煩惱。"}, {"id": 129, "lesson": "秋之味", "question": "秋之味：「我亦化身秋物，在短暫的秋裡憩息」下列哪一句文句最能與本句相呼應？", "options": {"A": "我的味蕾發現時蔬瓜果皆散發著金秋的溫潤好味道", "B": "傳統市場的菜蔬再怎麼新鮮就是少了大地的風味", "C": "天地間盈滿一種甜的，專屬於秋的成熟氣息", "D": "心極靜極沉，像一只熟得恰好的紅柿"}, "answer": "D", "explanation": "秋季時，作者將自己的心情與處境比喻成秋天的物產，同這些物產一起在秋季裡休息，故選(Ｄ)。"}, {"id": 130, "lesson": "秋之味", "question": "讀完秋之味後，可以得知秋天對於作者來說，是個什麼樣的季節？", "options": {"A": "冷清素淨的季節", "B": "生機處處，充滿活力的季節", "C": "百廢俱興的勞動季節", "D": "一事無成的閒散季節"}, "answer": "D", "explanation": ""}, {"id": 131, "lesson": "秋之味", "question": "「時序立冬，最後一個屬於秋的節氣終於過完，我卻仍然眷戀著愉悅感官的，甜美的秋天況味。」這段文句主要傳達秋天給人下列何種感覺？", "options": {"A": "不堪回首", "B": "心驚膽戰", "C": "度日如年", "D": "餘味無窮"}, "answer": "D", "explanation": "(Ａ)不忍再回憶過去的經歷或情景(Ｂ)形容十分害怕(Ｃ)過一天如過一年般的長。比喻日子不好過(Ｄ)事物意趣無窮，令人一再回味。"}, {"id": 132, "lesson": "秋之味", "question": "秋之味一文中，作者是如何察覺秋天已然到來？", "options": {"A": "聞到文旦的甜熟氣味", "B": "大部分時間對著金黃陽光出神", "C": "手邊總有丟不掉的煩雜事", "D": "傳統市場的菜蔬再怎麼新鮮就是少了大地的風味"}, "answer": "A", "explanation": ""}, {"id": 133, "lesson": "秋之味", "question": "秋之味：「時序入秋，我便開始恍惚。年年這樣，在飄浮狀態中緩緩滑入冬季，緩緩被寒流喚醒。」這段文句中的「飄浮狀態」是表現作者的何種情緒與樣貌？", "options": {"A": "因秋天到來而逐漸放鬆", "B": "受秋天影響而多愁善感", "C": "因秋天氣氛而文思泉湧", "D": "被秋天勾動了思鄉之情"}, "answer": "A", "explanation": "由題幹可知到了秋季作者進入休息、放鬆的狀態，故選(Ａ)"}, {"id": 134, "lesson": "秋之味", "question": "讀完秋之味一文後，可知作者最常在秋天進行怎樣的活動？", "options": {"A": "秋收冬藏，勞碌於農忙秋收", "B": "閒散的心情，看著陽光出神放空", "C": "把握時序入冬前的時光，出遊踏青", "D": "宅在家裡，打掃房屋內外"}, "answer": "B", "explanation": "由「秋天於我往往卻是一事無成的閒散季節。上課之外，大部分時間對著金黃陽光出神」可知選(Ｂ)。"}, {"id": 135, "lesson": "秋之味", "question": "下列出自秋之味一文的文句，哪一段話是作者將自己投身大自然，而與其融合共生的敘述？", "options": {"A": "時序入秋，我便開始恍惚", "B": "我亦化身秋物，在短暫的秋裡憩息", "C": "我的味蕾發現時蔬瓜果皆散發著金秋的溫潤好味道", "D": "吹著涼風浴暖陽，再品嘗秋天賜予的好禮"}, "answer": "B", "explanation": ""}, {"id": 136, "lesson": "秋之味", "question": "秋之味：「一年之中就數這個季節天時地利最適合享樂，奈何韶光短促，奈何手邊總有丟不掉的煩雜事。」這段描寫作者以何種口吻來表現其煩惱？", "options": {"A": "驚喜", "B": "感嘆", "C": "不滿", "D": "積極"}, "answer": "B", "explanation": "(Ｂ)題幹說明在最適合享樂的季節，手邊卻總有丟不掉的煩雜事，顯示出對於無法充分享受美好時光的遺憾和感嘆。"}, {"id": 137, "lesson": "秋之味", "question": "秋之味：「時序入秋，我便開始恍惚。年年這樣，在飄浮狀態中緩緩滑入冬季，緩緩被寒流喚醒。」下列何者最適合說明這段話的涵義？", "options": {"A": "作者每年都在期待秋天的來臨", "B": "每到秋天，作者的思緒便難以集中", "C": "寒冷的冬天會令人感到心神不振", "D": "秋冬之交，容易讓人迷迷糊糊"}, "answer": "B", "explanation": "從「時序入秋，我便開始恍惚。」可知一到秋天，作者便思緒不定，故選(Ｂ)。"}, {"id": 138, "lesson": "秋之味", "question": "下列關於秋之味的寫作手法，何者說明正確？", "options": {"A": "文章開頭寫秋日來臨後，心境感到放鬆，使人食欲大增", "B": "由文旦的轉變拉開秋日之美的序幕，接續再描寫瓜果時蔬開始散發的味道", "C": "自嗅覺書寫根莖類滋味變甘，口感變脆", "D": "藉由自身生活環境的改變，強調對於過往美好的眷戀"}, "answer": "B", "explanation": "(Ａ)，開頭描述秋日來臨後，自身發生的一些變化(Ｃ)自味覺書寫根莖類滋味變甘、口感變脆(Ｄ)藉由描寫食物的滋味，傳達出秋日的美好"}, {"id": 139, "lesson": "秋之味", "question": "「這家有機蔬菜把我的味蕾養刁了。」關於這句話的意思，下列何人的說明最恰當？", "options": {"A": "頌樂：這家店的蔬菜是她吃過最美味好吃的", "B": "輝人：除了這家店的蔬菜，其餘的她都不吃", "C": "華莎：這家店的蔬菜提升了她對食材的要求", "D": "玟星：這家店的蔬菜讓她的味覺敏感度提高"}, "answer": "C", "explanation": "從「味蕾養刁」可知選(Ｃ)。"}, {"id": 140, "lesson": "秋之味", "question": "秋之味：「中秋節前跟鄰居買的，一大麻袋兩百八十元，算算一顆十元左右，是鄰居的父親在苗栗山上老家所種，它們如今在矮几上排排坐，一放轉眼一個半月。」以上文字，作者用許多面向書寫文旦，請問不包含下列何者？", "options": {"A": "購買的時機", "B": "來源與產地", "C": "購入的價格", "D": "保存的期限"}, "answer": "D", "explanation": "(Ａ)中秋節前(Ｂ)鄰居父親苗栗山上老家(Ｃ)一大麻袋兩百八十元／一顆十元左右。"}, {"id": 141, "lesson": "秋之味", "question": "根據秋之味一文推論，「夏天易爛的葉菜類存放時間變長了。」其原因可能為何？", "options": {"A": "葉菜類受到夏天太陽照射容易腐敗", "B": "秋風將蔬菜的水分帶走，使之容易存放", "C": "家裡新買了冰箱可以幫助儲存食物", "D": "秋天時，氣溫開始降低，有助食物保存"}, "answer": "D", "explanation": ""}, {"id": 142, "lesson": "秋之味", "question": "「時序立冬，最後一個屬於秋的節氣終於過完，我卻仍然眷戀著愉悅感官的，甜美的秋天況味。」上述為秋之味一文的結語，作者欲藉此表達何種旨趣？", "options": {"A": "述說因錯過秋日美好事物而產生遺憾", "B": "說明不同的季節會帶來不同的新鮮感", "C": "慨嘆人的感覺隨著秋日的流逝而改變", "D": "堅定的傳達對秋日美好的喜愛與留戀"}, "answer": "D", "explanation": ""}, {"id": 143, "lesson": "秋之味", "question": "關於秋之味一文的說明，下列何者正確？", "options": {"A": "作者身處四季如夏的馬來西亞，總是覺得心浮氣躁", "B": "作者認為傳統市場的蔬菜更有大地的風味", "C": "作者品嘗大地所賜予的美食總是心存感恩", "D": "作者喜歡在涼爽的秋天動腦寫作"}, "answer": "C", "explanation": "(Ａ)從未因季節的牽引而波動(Ｂ)再怎麼新鮮就是少了大地的風味(Ｃ)由「常常吃著便不由得要感恩」可推知(Ｄ)作者在短暫的秋裡憩息。"}, {"id": 144, "lesson": "秋之味", "question": "「生活除了溫馨甜美，又何嘗不也有重重的挫折？他們像粗糙的繩索將我們緊緊綑綁，我們依然要以微笑面對生活，眼中依舊閃爍著希望的光彩。」這段話意思為何？", "options": {"A": "追求卓越要有挑戰的勇氣", "B": "享受人生要有悲憫的胸懷", "C": "擁有幸福要有憂患的意識", "D": "面對挫敗要有樂觀的心靈"}, "answer": "D", "explanation": "主旨說明生活中難免有挫折，但要能用微笑面對，樂觀處理，故選(Ｄ)。"}, {"id": 145, "lesson": "秋之味", "question": "秋之味：「剛來臺灣時不很明白，為什麼單只秋季如此？馬來西亞四季如夏，我的情緒從未因季節的牽引而波動。」由這段文句我們可以判知，為何作者的情緒以前都不曾受到季節變化而波動？", "options": {"A": "生活十分忙碌，無暇感受四季變化", "B": "初到臺灣，對生活環境還不太適應", "C": "家鄉氣候較為穩定，四季不太分明", "D": "離鄉後開始因季節變化而懷念故鄉"}, "answer": "C", "explanation": "(Ｃ)由「馬來西亞四季如夏，我的情緒從未因季節的牽引而波動。」可知"}, {"id": 146, "lesson": "鳥", "question": "關於鳥一文的寫作手法，下列敘述何者有誤？", "options": {"A": "表面上透過深刻的觀察呈現鳥的形象與苦悶，實則表達人被現實所囚之無奈", "B": "全文以現在、過去、現在的時空寫作，緊扣「我愛鳥」主題", "C": "作者對鳥深切喜愛，所以觀察細膩，從多方角度描寫型態，栩栩如生", "D": "文末以「不忍看」作結，除了呼應首段，亦有啟示人應具備尊重生命的仁愛胸襟"}, "answer": "A", "explanation": "(Ａ)表達對鳥的憐愛"}, {"id": 147, "lesson": "鳥", "question": "鳥一文中，可將鳥類分為兩大部分，籠中鳥與戶外自由鳥。課堂後，小奇整理表格如下，何者有誤？ \u0001", "options": {"A": "①", "B": "②", "C": "③", "D": "④"}, "answer": "C", "explanation": "(Ｃ)宜改「內心苦悶」"}, {"id": 148, "lesson": "鳥", "question": "「牠像虹似地一下就消逝了，牠留下的是無限的迷惘。」句中運用了彩虹來描寫鳥飛離的形象，下列何者非兩者之間相似處？", "options": {"A": "美麗繽紛的色彩", "B": "人與自然的溝通之橋", "C": "消逝迅速不留痕跡", "D": "類似弧形的路徑"}, "answer": "B", "explanation": "以虹的色彩、消逝速度與外觀，來描寫鳥飛離的形象，故不包括(Ｂ)"}, {"id": 149, "lesson": "鳥", "question": "梁實秋在鳥一文中，有許多針對鳥類描寫精采的文句，以下何者分析正確？", "options": {"A": "有的曳著長長的尾巴，有的翹著尖尖的長喙：體態之美", "B": "有的是胸襟上帶著一塊照眼的顏色：形狀之美", "C": "鳥的身軀都是玲瓏飽滿的，細瘦而不乾癟，豐腴而不臃腫：輕靈之美", "D": "看牠高踞枝頭，臨風顧盼：動作之美"}, "answer": "D", "explanation": "(Ａ)形狀之美(Ｂ)顏色之美(Ｃ)體態之美"}, {"id": 150, "lesson": "深藍的憂鬱", "question": "根據深藍的憂鬱一文的內容，是什麼原因令悲傷蟄伏在棋王心中許多日子？", "options": {"A": "人工智慧即將接管世界", "B": "深藍電腦棋藝難以捉摸", "C": "自己多次遭到深藍擊敗", "D": "深藍化身人形揶揄自己"}, "answer": "C", "explanation": "根據課文第一段，深藍電腦第十次擊敗棋王，讓他信心全失，沮喪得無地自容，故選(Ｃ)"}, {"id": 151, "lesson": "深藍的憂鬱", "question": "下列何者最不可能是深藍的憂鬱一文探究的議題？", "options": {"A": "人工智慧是否可能產生情感", "B": "人類大腦是否可能戰勝電腦", "C": "如何在人腦中植入電腦晶片", "D": "人性與電腦科技的依存關係"}, "answer": "C", "explanation": "本文雖然有描述科學家在人類頭腦中植入晶片的劇情，但並未刻意強調植入方式、過程等，反倒更著重於描寫人腦植入晶片後戰勝電腦以及電腦的情緒變化，故選(Ｃ)"}, {"id": 152, "lesson": "深藍的憂鬱", "question": "根據深藍的憂鬱一文的內容，下列何者為棋王親眼所見或實際體驗？", "options": {"A": "電腦人工智慧將接管全世界", "B": "與化為人形的深藍再次交手", "C": "深藍電腦對著棋王指指點點", "D": "全人類為棋王的勝利而鼓掌"}, "answer": "B", "explanation": "(Ａ)棋王對未來的推測(Ｃ)棋王對深藍的想像(Ｄ)棋王想像即將勝過深藍時的畫面"}, {"id": 153, "lesson": "深藍的憂鬱", "question": "根據深藍的憂鬱後半劇情，為何深藍電腦會說自己比棋王更像人類？", "options": {"A": "因為深藍電腦賽前向棋王禮貌問候", "B": "因為深藍電腦擁有人類的形體外貌", "C": "因為棋王在腦中植入超級電腦晶片", "D": "因為深藍被打敗且流露出人類情感"}, "answer": "D", "explanation": "在課文前半劇情，人類無法打敗深藍電腦。但當棋王在腦內植入電腦晶片後，深藍電腦發現自己像人類一樣被打敗，並且如同人類一般哭泣，因此才說自己比棋王更像人類，故選(Ｄ)"}, {"id": 154, "lesson": "深藍的憂鬱", "question": "關於深藍的憂鬱一文的寫作手法，下列敘述何者正確？", "options": {"A": "全文劇情主要使用第三人稱視角書寫", "B": "以倒敘手法作為開頭，預先揭露結局", "C": "透過劇情反轉暗示人類無法超越科技", "D": "在小說中加入科幻元素增添文學張力"}, "answer": "D", "explanation": "(Ａ)本文為第一人稱視角(Ｂ)小說以順敘法寫成(Ｃ)結局僅揭示科學家發現電腦產生如人類般的感情，但未對人類是否無法超越科技提出評論"}, {"id": 155, "lesson": "陋室銘", "question": "根據陋室銘，為何作者要引用孔子的「何陋之有」？", "options": {"A": "說明身處陋室，橘化為枳", "B": "以反詰語氣傾訴懷才不遇", "C": "重申題旨，呼應惟吾德馨", "D": "引用名言，使文章更華美"}, "answer": "C", "explanation": "隱含「君子居之」之意，作者以君子自居，說明品德可使陋室不陋，故選(Ｃ)。橘化為枳：比喻同樣的東西會因環境的不同而引起變化"}, {"id": 156, "lesson": "陋室銘", "question": "陋室銘一文中，作者以「諸葛亮」、「揚雄」作為典範，自我勉勵。從諸葛亮、揚雄兩人的共同點解讀作者對自身有何期許？", "options": {"A": "希望自己能夠受到重用，高官厚祿", "B": "期許回歸田園生活，並躬耕於南陽", "C": "期許文章能膾炙人口，令才名遠播", "D": "期許自己進德修業，有朝一展抱負"}, "answer": "D", "explanation": "二人初期均不被重用，諸葛亮躬耕南陽，揚雄於西蜀寫作，依舊潛心充實自我，終獲一番成就揚名於世，作者也希望能如同兩位賢人充實才德、一展抱負，故選(Ｄ)"}, {"id": 157, "lesson": "陋室銘", "question": "陋室銘一文第一段的重點在說明什麼？", "options": {"A": "地處偏僻，人煙罕至", "B": "名山勝水，景致優美", "C": "真心求取，心誠則靈", "D": "品德美好，名聲遠揚"}, "answer": "D", "explanation": "作者以山水比喻陋室，仙龍比喻自己，傳達陋室名聲也能因為自身品德而香氣遠播，故選(Ｄ)"}, {"id": 158, "lesson": "陋室銘", "question": "關於陋室銘一文的寫作手法，下列說明何者正確？", "options": {"A": "托物言志，以陋室表達自身才德高尚", "B": "用對偶、轉化等修辭法，富有節奏感", "C": "引用典故，以前賢對比自身才疏學淺", "D": "運用排比，強調陋室簡陋與自身清貧"}, "answer": "A", "explanation": "(Ａ)作者藉由描寫陋室的環境及其日常生活，表達了自身才德使陋室不陋的精神，故選。(Ｂ)未使用轉化修辭(Ｃ)以古代賢人作為典範，勉勵自己(Ｄ)未使用排比，且應是強調自身德性使陋室不陋"}, {"id": 159, "lesson": "鳥", "question": "下列何者是靜態描寫鳥的姿態？", "options": {"A": "跳盪得那樣輕靈，腳上像是有彈簧", "B": "稻田裡佇立著一隻白鷺，拳著一條腿", "C": "「一行白鷺上青天」，背後還襯著黛青的山色和釉綠的梯田", "D": "牠像虹似地一下就消逝了"}, "answer": "B", "explanation": "(Ｂ)描述白鷺長久站立於田中的靜態畫面，故選。(Ａ) (Ｃ)(Ｄ)動態描寫"}, {"id": 160, "lesson": "鳥", "question": "根據鳥一文，推論「旭日高升時，市聲鼎沸，鳥就沉默了」的原因，下列何者正確？", "options": {"A": "因為正午時段並不是鳥類的活動時間", "B": "人類與鳥類生活空間重疊，掩蓋鳥聲", "C": "鳥類因躲避人類捕捉而集體遷移住所", "D": "人們因忙碌於每日工作而忽略鳥鳴聲"}, "answer": "B", "explanation": "從「市聲鼎沸，鳥就沉默了」可知市街的喧嘩聲音大過鳥聲，故選(Ｂ)。(Ａ)(Ｃ)(Ｄ)文中並未提及"}, {"id": 161, "lesson": "鳥", "question": "下列選項中的圖表，何者最符合鳥一文第三段作者追述在四川聽到的鳥鳴種類？", "options": {"A": "\u0001", "B": "\u0001", "C": "\u0001", "D": "\u0001"}, "answer": "A", "explanation": "從「窗外是一片鳥囀」、「有時是獨奏，有時是合唱，簡直是一派和諧的交響樂」可知黎明時的鳥鳴種類最多；從「等到旭日高升，市聲鼎沸，鳥就沉默了」可知鳥鳴種類大幅減少；從「等到夜晚，才又聽到杜鵑叫」可知夜晚才又聽得見杜鵑的鳴聲，故選(Ａ)"}, {"id": 162, "lesson": "鳥", "question": "在鳥一文中，作者第一段指出「我愛鳥」，但是在第二段卻描寫「鳥的苦悶」，如此安排有何用意？", "options": {"A": "藉籠中鳥的苦悶反襯林中鳥自由", "B": "藉由鳥的苦悶反映人生際遇無常", "C": "以鳥的苦悶襯托出籠中生活優勢", "D": "強調鳥與人類之間深厚情感連結"}, "answer": "A", "explanation": "作者寫鳥的苦悶，強調鳥於自然中自由的樣態才是作者最想看見的，並藉由籠中鳥的苦悶反襯林中鳥的自由，故選(Ａ)"}, {"id": 163, "lesson": "秋之味", "question": "根據秋之味一文，下列敘述何者正確？", "options": {"A": "作者對於採購有機水果情有獨鍾", "B": "作者十分熱衷於自行網購有機蔬菜", "C": "作者認為有機蔬菜風味優於傳統市場", "D": "作者認為「大地的風味」取決於新鮮與否"}, "answer": "C", "explanation": "(Ｃ)根據「這家有機蔬菜把我的味蕾養刁了，傳統市場的菜蔬再怎麼新鮮就是少了大地的風味」可見有機蔬菜比傳統市場多了「大地的風味」，故選。(Ａ)未提及作者於傳統市場購買的是否為有機水果(Ｂ)有機蔬菜是由瑜伽班同學代買(Ｄ)由「傳統市場的菜蔬再怎麼新鮮就是少了大地的風味」可知作者認定的「大地的風味」並非取決於新鮮與否"}, {"id": 164, "lesson": "秋之味", "question": "秋之味一文透過秋季時分各種蔬果變化的描述，闡述出何種情懷？", "options": {"A": "以食物的氣味、滋味表現秋日的美好", "B": "以瓜果的成熟，帶出人們應勇於挑戰", "C": "以瓜類從甜美到腐敗，闡明生命衰頹", "D": "詳述瓜果的耕作過程，表現知足常樂"}, "answer": "A", "explanation": "根據「這是秋天。天地間盈滿一種甜的，專屬於秋的成熟氣息」可知作者透過蔬果變化表現秋日之美，故選(Ａ)。(Ｂ)未提及勇於面對挑戰(Ｃ)未提及瓜果腐敗，也未闡述生命的衰頹(Ｄ)未詳述瓜果耕作過程，也未強調知足常樂"}, {"id": 165, "lesson": "秋之味", "question": "在秋之味一文中，下列何者最符合作者到臺灣後，感受到異於昔日季節變化的觀察？", "options": {"A": "作者藉由對臺灣秋季的描述，批評臺灣的氣候寒冷不適定居", "B": "作者認為馬來西亞的氣候令人厭倦，因為全年如夏缺乏變化", "C": "作者指出馬來西亞四季變化，讓她更理解穩定情緒的重要性", "D": "作者覺得臺灣的秋季獨特，因季節的遞嬗而牽動情緒"}, "answer": "D", "explanation": "(Ｄ)根據「為什麼單只秋季如此？」可見秋季獨特，從「馬來西亞四季如夏，我的情緒從未因季節的牽引而波動」可推知秋季讓作者因季節的變化牽動情緒，故選。(Ａ)未批評臺灣的氣候寒冷不適定居。(Ｂ)未認為馬來西亞的氣候令人厭倦(Ｃ)未說明穩定情緒的重要性"}, {"id": 166, "lesson": "秋之味", "question": "在秋之味一文中，作者為何在首段描述秋天時，要提到紅柿、黃葉等印象？", "options": {"A": "暗示秋天的各種豐收與美好", "B": "強調作者對秋季飲食的偏好", "C": "秋季的閒散令作者心思靜沉", "D": "表現秋季植物大多色彩繽紛"}, "answer": "C", "explanation": "根據「上課之外，大部分時間對著金黃陽光出神，腦海裡似什麼都沒有，也似什麼都有，心極靜極沉，像一只熟得恰好的紅柿，一串黃到巔峰的香蕉，水分飽脹的秋梨，滿樹棲止的黃葉，我亦化身秋物，在短暫的秋裡憩息。」可知作者以秋季閒散季節中的黃葉、熟柿等意象，形容自己「心極靜極沉」，表現出一種靜謐、悠然的情感，故選(Ｃ)"}, {"id": 167, "lesson": "秋之味", "question": "關於秋之味一文的寫作手法，下列敘述何者正確？", "options": {"A": "首段以開門見山法寫作，詳述各種秋季食物的滋味", "B": "次段以文旦覺察到秋日對自己的影響，為藉物抒情", "C": "全篇精采地描寫各種秋日滋味，屬於純粹的記敘文", "D": "末段以層遞修辭描寫秋日將盡，煩雜事卻愈堆愈高"}, "answer": "B", "explanation": "(Ｂ)透過「文旦（物）」抒發自己的情感，故選。(Ａ)未詳述各種秋季食物的滋味(Ｃ)除了記敘還包含各種情感的抒發(Ｄ)使用映襯修辭，以俗事煩心對比秋日美好，進一步凸顯秋日的美好及短暫"}, {"id": 168, "lesson": "鳥", "question": "鳥一文開頭是屬於何種筆法？", "options": {"A": "破題法", "B": "冒題句", "C": "引用法", "D": "譬喻法"}, "answer": "A", "explanation": "(Ａ)首段開門見山點出文章主旨─「我愛鳥」"}, {"id": 169, "lesson": "鳥", "question": "「世界上的生物，沒有比鳥更俊俏的。」這句話使用了何種修辭法？", "options": {"A": "譬喻", "B": "映襯", "C": "倒反", "D": "誇飾"}, "answer": "D", "explanation": "以誇飾修辭形容鳥的俊俏，故選(Ｄ)"}, {"id": 170, "lesson": "鳥", "question": "「胳膊上架著的鷹，有時頭上蒙著一塊皮子，羽翮不整地蜷伏著不動。」這段文字寫出鳥處在什麼樣的狀態？", "options": {"A": "得意", "B": "悠閒", "C": "鼓噪", "D": "苦悶"}, "answer": "D", "explanation": "用「羽翮不整地蜷伏著不動」形容鳥垂頭喪氣的苦悶狀態，故選(Ｄ)"}, {"id": 171, "lesson": "鳥", "question": "「穠纖合度」之於「恰到好處」，猶如「瞵視昂藏」之於下列何者？", "options": {"A": "顧盼神飛", "B": "垂頭喪氣", "C": "恰如其分", "D": "每下愈況"}, "answer": "A", "explanation": "題幹關係為相似詞，故答案選(Ａ)顧盼左右，神采飛揚"}, {"id": 172, "lesson": "鳥", "question": "「等到旭日高升，市聲鼎沸，鳥就沉默了，不知到哪裡去了。」由這段文字可推知人和鳥的何種關係？", "options": {"A": "鳥類被人類訓練累了而休息", "B": "人類和鳥類的作息時間相反", "C": "人類與鳥類的生活空間重疊", "D": "鳥類體貼人類活動而讓位"}, "answer": "C", "explanation": "由題幹可知人與鳥的生活空間會影響彼此，表示生活空間有所重疊，故選(Ｃ)"}, {"id": 173, "lesson": "鳥", "question": "「有時候稻田裡佇立著一隻白鷺」，是由什麼角度來描寫鳥？", "options": {"A": "低姿態", "B": "高姿態", "C": "靜態", "D": "動態"}, "answer": "C", "explanation": "靜態摹寫"}, {"id": 174, "lesson": "鳥", "question": "鳥一文的描寫時間順序應為下列何者？", "options": {"A": "現在→過去→現在", "B": "現在→過去→未來", "C": "過去→現在→過去", "D": "過去→現在→未來"}, "answer": "A", "explanation": "以「現在→過去→現在」的方式敘寫"}, {"id": 175, "lesson": "鳥", "question": "讀完鳥，可知作者最可能支持下列哪種態度？", "options": {"A": "綠化環境", "B": "尊重生命", "C": "珍惜回憶", "D": "欣賞音樂"}, "answer": "B", "explanation": "由作者不忍心看鳥兒被剝奪自由，喜歡看鳥自由飛翔可看出作者尊重生命的態度，故選(Ｂ)。(Ａ)(Ｃ)(Ｄ)文中皆未提及"}, {"id": 176, "lesson": "鳥", "question": "下列有關鳥一文的敘述，何者正確？", "options": {"A": "全文扣緊「客夜聞此，說不出的酸楚」這句話來描寫", "B": "細膩描寫鳥鳴聲與形體美，表現作者對鳥的愛惜之情", "C": "文中描述籠中鳥的情形，主要是在暗示休閒的重要性", "D": "作者主要是用動物學的觀點真實描寫各種鳥類的叫聲"}, "answer": "B", "explanation": "(Ａ)我愛鳥(Ｃ)自由的可貴(Ｄ)音樂的觀點"}, {"id": 177, "lesson": "深藍的憂鬱", "question": "下列選項，何者使用的修辭方法與「（深藍電腦）就像一個聰明絕頂的俊美青年」一句相同？", "options": {"A": "生年不滿百，常懷千歲憂", "B": "白日依山盡，黃河入海流", "C": "紅豆生南國，春來發幾枝", "D": "舉頭見月輪，涕下如雨零"}, "answer": "D", "explanation": "題幹與(Ｄ)譬喻，(Ａ)映襯(Ｂ)對偶(Ｃ)設問"}, {"id": 178, "lesson": "深藍的憂鬱", "question": "下列選項，何者的句型與「全世界的媒體和科學家多少年前就發出驚人的警告和疑問」相同？", "options": {"A": "教孩子面對挫折是重要的課題", "B": "逃避問題的人一向懦弱無能", "C": "植物能帶給人們穩定的好心情", "D": "君子應有一笑泯恩仇的氣概"}, "answer": "C", "explanation": "題幹與(Ｃ)敘事句，(Ａ)判斷句(Ｂ)表態句(Ｄ)有無句"}, {"id": 179, "lesson": "深藍的憂鬱", "question": "下列選項，何者是「全世界的媒體和科學家多少年前就發出驚人的警告和疑問，難道即將成為事實」句中所謂的「事實」？", "options": {"A": "與深藍對弈的慘敗", "B": "電腦即將接管世界", "C": "深藍簡直不堪一擊", "D": "人類與機器智慧的決戰"}, "answer": "B", "explanation": "(Ｂ)棋王與深藍對弈慘敗讓人類恐懼電腦智慧"}, {"id": 180, "lesson": "深藍的憂鬱", "question": "下列關於深藍的憂鬱的敘述，何者正確？", "options": {"A": "採用第三人稱的客觀立場進行創作", "B": "透過科學幻想探討人工智慧的說明文", "C": "取材新穎，表現了對未來科技的豐富想像", "D": "以人與電腦對弈的情節，歌頌科技的進步"}, "answer": "C", "explanation": "(Ａ)第一人稱(Ｂ)記敘文(Ｄ)引發讀者對於人工智慧的思考"}, {"id": 181, "lesson": "深藍的憂鬱", "question": "下列選項，何者是作者刻意塑造的王者之尊、贏家風範？", "options": {"A": "電腦即將接管世界了！人類的智慧還有用嗎", "B": "深藍電腦已化身為人形的傢伙在揶揄我", "C": "深藍簡直不堪一擊，一敗塗地，而且，大聲哭起來", "D": "眼眸顯示出迷人的晶藍，銀亮的頭髮有著高貴的氣質"}, "answer": "D", "explanation": "(Ａ)人類對於電腦智慧將要超越自己的恐懼(Ｂ)棋王內心的恐懼(Ｃ)機器人有了情感(Ｄ)描述深藍出色的外形來塑造贏家的王者風範"}, {"id": 182, "lesson": "深藍的憂鬱", "question": "關於深藍的憂鬱的說明，下列何者正確？", "options": {"A": "透過對話、動作呈現人物個性與情感", "B": "藉由深藍的內心獨白凸顯棋王的恐懼", "C": "結局是人腦戰勝電腦，扳回一城", "D": "文中的主角是科學家與棋王"}, "answer": "A", "explanation": "(Ｂ)棋王的內心獨白(Ｃ)植入晶片的棋王已不能算單純的人腦(Ｄ)深藍與棋王"}, {"id": 183, "lesson": "深藍的憂鬱", "question": "下列何者最適合作為深藍的憂鬱一文的註解？", "options": {"A": "當人工智慧發展到極致，機器人與人的差別為何", "B": "須培養運動家的精神：勝不驕、敗不餒，不斷進步", "C": "人性的無情、冷血與不擇手段，比機器人還可怕", "D": "機器人與人工智慧持續的進步，增加了人類的福祉"}, "answer": "A", "explanation": "本文藉由越來越像人類的機器人深藍與裝了電腦晶片的人類比賽，提出人類與機器人之間差異的省思，故選(Ａ)"}, {"id": 184, "lesson": "秋之味", "question": "「心極靜極沉，像一只熟得恰好的紅柿」運用譬喻修辭技巧，下列選項，何者用法與此相同？", "options": {"A": "有緣千里來相會，無緣對面不相識", "B": "朝辭白帝彩雲間，千里江陵一日還", "C": "漢兵奮迅如霹靂，虜騎崩騰畏蒺藜", "D": "東邊日出西邊雨，道是無晴還有晴"}, "answer": "C", "explanation": "(Ａ)映襯(Ｂ)誇飾(Ｄ)雙關"}, {"id": 185, "lesson": "鳥", "question": "下列選項中的文句，何者最為通順？", "options": {"A": "天地間盈滿充斥一種甜的，專屬於秋的成熟氣息", "B": "生吃尤顯滋味，常常吃著便不由得忍不住要感恩", "C": "傳統市場的菜蔬再怎麼新鮮就是少了大地的風味", "D": "特別尤其是經過南風加持後，我甘願過著安逸生活"}, "answer": "C", "explanation": "(Ａ)「盈滿」、「充斥」擇一即可(Ｂ)「不由得」、「忍不住」擇一即可(Ｄ)「特別」、「尤其」擇一即可"}, {"id": 186, "lesson": "秋之味", "question": "下列選項，何者與「特別是經過南風加持之後」的「南風」代表的季節相同？", "options": {"A": "但將酩酊酬佳節，不用登臨恨落暉", "B": "吟罷明朝贈知己，便須題作去年詩", "C": "誰家見月能閒坐，何處聞燈不看來", "D": "不效艾符趨習俗，但祈蒲酒話升平"}, "answer": "D", "explanation": "(Ａ)重陽節，秋天(Ｂ)除夕，冬天(Ｃ)元宵節，春天(Ｄ)端午節，夏天，與題幹相同"}, {"id": 187, "lesson": "秋之味", "question": "「這家有機蔬菜把我的味蕾養刁了，傳統市場的菜蔬再怎麼新鮮就是少了大地的風味。」關於上文的解讀，下列何者正確？", "options": {"A": "作者覺得傳統市場的菜蔬較為美味", "B": "有機蔬菜的大地風味深獲作者好評", "C": "市場的菜蔬新鮮度比不上有機蔬菜", "D": "有機和傳統市場的蔬菜，作者偏愛後者"}, "answer": "B", "explanation": "(Ａ)有機蔬菜較為美味(Ｃ)傳統市場的菜蔬沒有不新鮮(Ｄ)前者"}, {"id": 188, "lesson": "秋之味", "question": "下列關於秋之味一文的寫作方式，何者正確？", "options": {"A": "全文皆為正面論述，讓讀者沉浸於作者刻畫的美好", "B": "描寫菜蔬在視覺和觸覺上的美好變化，成為文章基礎", "C": "藉由生活中的事物表達情感，是抒情文常用手法", "D": "利用紅柿的變化拉開秋日序幕，瓜果也開始產生變化"}, "answer": "C", "explanation": "(Ａ)作者也曾感嘆現實生活煩雜之事的逼仄(Ｂ)嗅覺和味覺(Ｄ)文旦"}, {"id": 189, "lesson": "秋之味", "question": "下列關於秋之味的說明，何者正確？", "options": {"A": "從日常生活中選取創作的題材，傳達心境的變化", "B": "以「變得恍惚」說明緊繃的心境更容易讓人打開感官", "C": "「腦海裡似什麼都沒有」可知作者散漫的生活態度", "D": "本文大量運用誇飾、轉化修辭，傳達出秋日的美好"}, "answer": "A", "explanation": "(Ｂ)心境的放鬆(Ｃ)呈現恍神狀態，未提及生活態度散漫(Ｄ)摹寫、譬喻"}, {"id": 190, "lesson": "秋之味", "question": "秋之味：「我亦化身秋物，在短暫的秋裡憩息」下列哪一句文句最能與本句相呼應？", "options": {"A": "我的味蕾發現時蔬瓜果皆散發著金秋的溫潤好味道", "B": "傳統市場的菜蔬再怎麼新鮮就是少了大地的風味", "C": "天地間盈滿一種甜的，專屬於秋的成熟氣息", "D": "心極靜極沉，像一只熟得恰好的紅柿"}, "answer": "D", "explanation": "秋季時，作者將自己的心情與處境比喻成秋天的物產，同這些物產一起在秋季裡休息，故選(Ｄ)"}, {"id": 191, "lesson": "秋之味", "question": "杏林子：「打了霜的柿子才甜，因為，唯有苦寒，才能將那一分酸澀催化成香精和糖分。」這段話的意思與下列何者最相近？", "options": {"A": "人無千日好，花無百日紅", "B": "一鳥在手，勝於二鳥在林", "C": "蓮之可貴在於出淤泥而不染", "D": "磚塊未經火煉前，原是軟土"}, "answer": "D", "explanation": "題幹強調體悟試煉可使人成長的道理，故選(Ｄ)"}, {"id": 192, "lesson": "陋室銘", "question": "「山不在高，有仙則名；水不在深，有龍則靈。斯是陋室，惟吾德馨。」以上是強調什麼的重要性？", "options": {"A": "風景名勝，好山好水", "B": "天外飛仙，點石成金", "C": "珍禽異獸，奇花異草", "D": "品格德行，修身養性"}, "answer": "D", "explanation": "(Ｄ)以「山、水」比喻居室；以「仙、龍」比喻有品德、學識之人。說明只要有才德就能夠揚名"}, {"id": 193, "lesson": "陋室銘", "question": "「可以調素琴，閱金經。無絲竹之亂耳，無案牘之勞形。」此句充分顯示出陋室主人的何種特質？", "options": {"A": "生活恬淡", "B": "仁者胸懷", "C": "學識淵博", "D": "謙虛為懷"}, "answer": "A", "explanation": "顯示出主人輕鬆自在的生活，故選(Ａ)"}, {"id": 194, "lesson": "陋室銘", "question": "「苔痕上階綠」中的「上」字為「長到……之上」的意思，為動詞，請問下列「上」字何者也是動詞？", "options": {"A": "樓「上」有人", "B": "尊君親「上」", "C": "「上」流社會", "D": "「上」奏獻計"}, "answer": "D", "explanation": "(Ａ)物體的表面、高處或邊側，名詞(Ｂ)尊長或在上位的人，名詞(Ｃ)地位高，形容詞(Ｄ)進呈，動詞"}, {"id": 195, "lesson": "陋室銘", "question": "「自古以來，□□勞心，□□勞形，似乎是普遍的現象。」空格內依序應填入哪些詞語？", "options": {"A": "案牘、絲竹", "B": "鴻儒、亂耳", "C": "鴻儒、白丁", "D": "金經、素琴"}, "answer": "C", "explanation": "(Ｃ)鴻儒學問淵博，多從事費腦力的工作；白丁學識有限，多從事費體力的工作"}, {"id": 196, "lesson": "陋室銘", "question": "「何陋之有」使用的修辭和下列何者相同？", "options": {"A": "泣涕零如雨", "B": "酣觴賦詩", "C": "如花似玉", "D": "徐噴以煙"}, "answer": "D", "explanation": "題幹與(Ｄ)倒裝，(Ａ)(Ｃ)譬喻(Ｂ)借代，「觴」借指「酒」"}, // ===== SUPABASE HELPERS =====
async function sbGet(table, params) {
  const url = new URL(SUPABASE_URL + '/rest/v1/' + table);
  if (params) Object.entries(params).forEach(function(e) { url.searchParams.set(e[0], e[1]); });
  const res = await fetch(url.toString(), {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
  });
  if (!res.ok) throw new Error('sb get error ' + res.status);
  return res.json();
}

async function sbPost(table, data, prefer) {
  const headers = {
    'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY,
    'Content-Type': 'application/json'
  };
  if (prefer) headers['Prefer'] = prefer;
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + table, {
    method: 'POST', headers: headers, body: JSON.stringify(data)
  });
  return res;
}

async function sbUpsert(table, data) {
  return sbPost(table, data, 'resolution=merge-duplicates');
}

// ===== SHA-256 =====
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
}

const KEY_STATS = 'cn_stats';
const KEY_WRONG = 'cn_wrong';
let stats = {};
let wrongSet = new Set();

function loadLocalStorage() {
  try {
    stats = JSON.parse(localStorage.getItem(KEY_STATS) || '{}');
    wrongSet = new Set(JSON.parse(localStorage.getItem(KEY_WRONG) || '[]'));
  } catch(e) { stats = {}; wrongSet = new Set(); }
}
function saveLocalStorage() {
  localStorage.setItem(KEY_STATS, JSON.stringify(stats));
  localStorage.setItem(KEY_WRONG, JSON.stringify([...wrongSet]));
}

// ===== SCORE FORMULA =====
function computeScore(totalAnswered, correctCount) {
  if (totalAnswered === 0) return 0;
  var accuracy = Math.round(correctCount / totalAnswered * 100);
  return totalAnswered + accuracy;
}
function getTotals() {
  var total = 0, correct = 0;
  Object.values(stats).forEach(function(v){ total += v.correct + v.wrong; correct += v.correct; });
  return { total: total, correct: correct };
}

// ===== SYNC TO SUPABASE =====
async function syncScore() {
  if (!nickname) return;
  var t = getTotals();
  var score = computeScore(t.total, t.correct);
  try {
    await sbUpsert('cn_scores', {
      nickname: nickname,
      total_answered: t.total,
      correct_count: t.correct,
      score: score,
      updated_at: new Date().toISOString()
    });
  } catch(e) { /* silent fail */ }
}

function scheduleSync() {
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncScore, 3000);
}

var loginMode = ''; // 'new' or 'existing'

window.onload = function() {
  document.getElementById('nickname-input').addEventListener('keydown', function(e){
    if(e.key==='Enter') step1Next();
  });
  document.getElementById('password-input').addEventListener('keydown', function(e){
    if(e.key==='Enter') step2Submit();
  });
  document.getElementById('password-confirm').addEventListener('keydown', function(e){
    if(e.key==='Enter') step2Submit();
  });
};

async function step1Next() {
  var name = document.getElementById('nickname-input').value.trim();
  if (!name) { document.getElementById('nickname-input').focus(); return; }
  var btn = document.getElementById('step1-btn');
  var msg = document.getElementById('step1-msg');
  btn.disabled = true;
  btn.textContent = '查詢中…';
  msg.className = 'login-msg';
  msg.style.display = 'none';
  try {
    var rows = await sbGet('cn_users', { 'nickname': 'eq.' + name, 'select': 'nickname' });
    if (rows.length === 0) {
      // 新用戶
      loginMode = 'new';
      document.getElementById('step2-who').textContent = '👋 「' + name + '」是新帳號，請設定密碼';
      document.getElementById('pw-label').textContent = '設定密碼';
      document.getElementById('password-confirm').style.display = 'block';
      document.getElementById('step2-btn').textContent = '建立帳號';
    } else {
      // 既有用戶
      loginMode = 'existing';
      document.getElementById('step2-who').textContent = '👤 歡迎回來，' + name + '！';
      document.getElementById('pw-label').textContent = '輸入密碼';
      document.getElementById('password-confirm').style.display = 'none';
      document.getElementById('step2-btn').textContent = '登入';
    }
    document.getElementById('login-step1').style.display = 'none';
    document.getElementById('login-step2').style.display = 'block';
    document.getElementById('password-input').value = '';
    document.getElementById('password-confirm').value = '';
    document.getElementById('step2-msg').className = 'login-msg';
    document.getElementById('step2-msg').style.display = 'none';
    setTimeout(function(){ document.getElementById('password-input').focus(); }, 100);
  } catch(e) {
    msg.textContent = '⚠️ 網路錯誤，請稍後再試';
    msg.className = 'login-msg error';
  }
  btn.disabled = false;
  btn.textContent = '繼續 →';
}

async function step2Submit() {
  var name = document.getElementById('nickname-input').value.trim();
  var pw = document.getElementById('password-input').value;
  var pw2 = document.getElementById('password-confirm').value;
  var msg = document.getElementById('step2-msg');
  var btn = document.getElementById('step2-btn');

  if (!pw) { document.getElementById('password-input').focus(); return; }

  if (loginMode === 'new') {
    if (pw !== pw2) {
      msg.textContent = '❌ 兩次密碼不一致，請重新輸入';
      msg.className = 'login-msg error';
      return;
    }
    if (pw.length < 4) {
      msg.textContent = '❌ 密碼至少需要 4 個字元';
      msg.className = 'login-msg error';
      return;
    }
  }

  btn.disabled = true;
  btn.textContent = loginMode === 'new' ? '建立中…' : '驗證中…';
  msg.className = 'login-msg';
  msg.style.display = 'none';

  try {
    var hash = await sha256(pw);
    if (loginMode === 'new') {
      var res = await sbPost('cn_users', { nickname: name, password_hash: hash });
      if (!res.ok) {
        var body = await res.json();
        if (body.code === '23505') {
          msg.textContent = '❌ 這個暱稱已被使用，請換一個';
        } else {
          msg.textContent = '❌ 建立失敗，請稍後再試';
        }
        msg.className = 'login-msg error';
        btn.disabled = false;
        btn.textContent = '建立帳號';
        return;
      }
    } else {
      var rows = await sbGet('cn_users', { 'nickname': 'eq.' + name, 'select': 'password_hash' });
      if (rows.length === 0 || rows[0].password_hash !== hash) {
        msg.textContent = '❌ 密碼錯誤，請再試一次';
        msg.className = 'login-msg error';
        btn.disabled = false;
        btn.textContent = '登入';
        return;
      }
    }
    enterApp(name);
  } catch(e) {
    msg.textContent = '⚠️ 網路錯誤，請稍後再試';
    msg.className = 'login-msg error';
    btn.disabled = false;
    btn.textContent = loginMode === 'new' ? '建立帳號' : '登入';
  }
}

function backToStep1() {
  document.getElementById('login-step1').style.display = 'block';

function enterApp(name) {
  nickname = name;
  loadLocalStorage();
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('user-badge').textContent = '👤 ' + nickname;

  updateScoreBadge();
