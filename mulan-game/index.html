<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>木蘭傳 — 課堂打怪遊戲</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% 30%, #2d1b69 0%, #1a0a3a 40%, #0a0a1a 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: '微軟正黑體', 'PingFang TC', sans-serif;
    color: #eee;
  }
  h1 {
    font-size: 36px; color: #e94560;
    text-shadow: 0 0 20px rgba(233,69,96,0.6), 2px 2px 0 #7b0f1f;
    margin-bottom: 8px; letter-spacing: 4px;
  }
  p { color: #aaa; margin-bottom: 48px; font-size: 14px; }
  .cards {
    display: flex; gap: 24px; flex-wrap: wrap; justify-content: center;
  }
  .card {
    background: rgba(255,255,255,0.05);
    border: 2px solid rgba(255,255,255,0.12);
    border-radius: 16px; padding: 32px 36px;
    text-align: center; cursor: pointer;
    text-decoration: none; color: inherit;
    transition: all 0.25s;
    backdrop-filter: blur(8px);
    min-width: 180px;
  }
  .card:hover {
    transform: translateY(-6px);
    border-color: var(--c);
    box-shadow: 0 8px 32px var(--glow);
  }
  .card .icon { font-size: 48px; margin-bottom: 12px; }
  .card .name { font-size: 18px; font-weight: bold; margin-bottom: 4px; }
  .card .desc { font-size: 12px; color: #888; }
  .teacher { --c: #4ecdc4; --glow: rgba(78,205,196,0.3); }
  .student  { --c: #f5a623; --glow: rgba(245,166,35,0.3); }
  .admin    { --c: #e94560; --glow: rgba(233,69,96,0.3); }
</style>
</head>
<body>
  <h1>⚔ 木蘭傳 ⚔</h1>
  <p>課堂互動打怪遊戲</p>
  <div class="cards">
    <a class="card teacher" href="teacher.html">
      <div class="icon">🖥️</div>
      <div class="name">教師大螢幕</div>
      <div class="desc">投影給全班看</div>
    </a>
    <a class="card student" href="student.html">
      <div class="icon">📱</div>
      <div class="name">學生投票</div>
      <div class="desc">手機掃 QR 碼進入</div>
    </a>
    <a class="card admin" href="admin.html">
      <div class="icon">⚙️</div>
      <div class="name">管理面板</div>
      <div class="desc">老師控制遊戲進度</div>
    </a>
  </div>
</body>
</html>
